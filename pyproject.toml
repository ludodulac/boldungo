[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brickhouse-ai"
version = "0.1.0"
description = "Core contracts for BrickHouse AI"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai>=1.100,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "playwright>=1.50,<2",
]

[project.scripts]
brickhouse-m0 = "brickhouse.pipeline:main"
brickhouse-scene-build = "brickhouse.scene_cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["brickhouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = ["--import-mode=importlib"]