er ZIP</button><button id="import">Importer un dossier ZIP</button></div><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><input id="zip" type="file" accept=".zip,application/zip" hidden><strong id="count"></strong><div id="status" role="status" aria-live="polite"></div><section id="cards" aria-label="Photos du dossier"></section></main><script type="module" src="./photo-package-ui.js"></script></body></html>
