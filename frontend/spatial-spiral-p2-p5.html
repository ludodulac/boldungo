<!doctype html><meta charset="utf-8"><title>Boldüngo · First spatial spiral P2–P5</title>
<style>body{font:15px system-ui;background:#0f1720;color:#e8eef5;margin:0}main{max-width:1180px;margin:auto;padding:24px}h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:#172231;border:1px solid #34465b;border-radius:14px;padding:16px}.world{position:relative;height:470px;background:#0b1119;border-radius:12px;overflow:hidden}.wall{position:absolute;left:30%;top:12%;width:48%;height:60%;border:3px solid #aeb9c5;background:#aeb9c522}.window{position:absolute;left:43%;top:20%;width:8%;height:17%;border:3px solid #d8e2ec}.box{position:absolute;left:49%;top:48%;width:24%;height:28%;border:3px solid #d4dce5;background:#d4dce51f}.opening{position:absolute;left:54%;top:58%;width:13%;height:17%;background:#05080c;border:2px solid #8392a4}.stair{position:absolute;left:16%;top:54%;width:37%;height:8%;border-top:5px solid #d8e0e8;transform:rotate(-31deg);transform-origin:right center}.deck{position:absolute;left:70%;top:45%;width:25%;height:10%;border-top:5px solid #b99b73;border-bottom:3px dashed #b99b73}.unknown{border-style:dashed!important}.legend b{display:inline-block;width:16px;height:10px;border:2px solid #d8e2ec;margin-right:6px}.bad{color:#ffb4b4}.good{color:#a8e6b1}li{margin:.45em 0}code{color:#b9d7ff}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.photos img{width:100%;border-radius:8px}</style>
<main><h1>Première spirale spatiale · P2–P3–P4–P5</h1><p id="status"></p>
<div class="photos"><img src="./benchmarks/real-house-5/02-original.jpg"><img src="./benchmarks/real-house-5/03-original.jpg"><img src="./benchmarks/real-house-5/04-original.jpg"><img src="./benchmarks/real-house-5/05-original.jpg"></div>
<div class="grid"><section class="card"><h2>Petit monde survivant — qualitatif, non métrique</h2><div class="world"><div class="wall unknown"></div><div class="window"></div><div class="box"></div><div class="opening"></div><div class="stair"></div><div class="deck unknown"></div></div><p>Ce dessin n'est pas une coque 3D : il montre seulement l'organisation relative survivante. Les contours pointillés signalent des étendues inconnues.</p></section>
<section class="card"><h2>Confrontation aux vues</h2><div id="checks"></div><h2>Révision</h2><div id="revision"></div><h2>Inconnues conservées</h2><ul id="unknowns"></ul></section></div></main>
<script type="module">const a=await (await fetch('./spatial-spiral-p2-p5.json')).json();document.querySelector('#status').innerHTML='<b>VIEW_EXPLANATION_GAIN</b> · aucune géométrie métrique ajoutée · 062 révisable par retour aux pixels.';const c=document.querySelector('#checks');for(const o of a.organizations){const h=document.createElement('div');h.innerHTML='<h3>'+o.id+' — '+o.revision+'</h3>'+o.predictions.map(p=>'<p class="'+(p.check==='SUPPORTED'?'good':'bad')+'">P'+p.photo_index+' · '+p.check+' — '+p.prediction+'</p>').join('');c.append(h)}document.querySelector('#revision').innerHTML='<p class="bad">Rejeté : <code>obs_p2_stair</code> et <code>obs_p2_box_volume</code> comme support pixel de P2.</p><p class="good">Survit : organisation qualitative mur + volume projeté + escalier + terrasse pour le secteur P3/P4/P5.</p>';document.querySelector('#unknowns').innerHTML=a.surviving_small_world.unresolved.map(x=>'<li>'+x+'</li>').join('');</script>
