<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLDÜNGO — Prototypes d'échelle contrôlés</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#101827;color:#fff}.bar{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar strong{font-size:1.25rem;margin-right:auto}.bar button{font:inherit;font-weight:700;padding:9px 13px;border:1px solid #94a3b8;border-radius:8px;background:#fff;color:#111827}.bar button[aria-pressed=true]{outline:3px solid #f59e0b}iframe{width:100%;height:calc(100vh - 68px);border:0;background:#101827}</style></head>
<body><div class="bar"><strong id="label">24 TENONS — CONTROLLED_SCALE_PROTOTYPE</strong><button data-w="24" aria-pressed="true">24</button><button data-w="32">32</button><button data-w="51">51</button><button data-w="57">57</button></div><iframe id="view" title="Prototype façade 24 tenons"></iframe>
<script>const widths=[24,32,51,57],view=document.querySelector('#view'),label=document.querySelector('#label');function show(w){if(!widths.includes(w))w=24;label.textContent=w+' TENONS — CONTROLLED_SCALE_PROTOTYPE';view.title='Prototype façade '+w+' tenons';view.src='./viewer.html?bundle='+encodeURIComponent('experiments/scale-prototypes/scale-'+w+'-front-export.json');for(const b of document.querySelectorAll('button[data-w]'))b.setAttribute('aria-pressed',String(Number(b.dataset.w)===w));history.replaceState(null,'','?width='+w)}for(const b of document.querySelectorAll('button[data-w]'))b.onclick=()=>show(Number(b.dataset.w));show(Number(new URLSearchParams(location.search).get('width'))||24);</script></body></html>
