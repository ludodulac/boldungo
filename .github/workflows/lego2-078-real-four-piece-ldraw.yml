name: LEGO2-078 four-piece pinned real LDraw probe

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'scripts/probe_ridge_full_ldraw_078.py'
      - 'scripts/download_ldraw_probe_066.py'
      - 'backend/brickhouse/bricks/ridge_four_piece_assembly_077.py'
      - 'tests/bricks/test_real_ldraw_four_piece_078.py'
      - '.github/workflows/lego2-078-real-four-piece-ldraw.yml'
  workflow_dispatch:

jobs:
  real-four-piece:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry engine and backend
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Download ONLY 3005 26603 30363 87079 and transitive dependencies
        run: |
          python scripts/download_ldraw_probe_066.py /tmp/lego2-078-ldraw \
            --max-files 240 --parts 3005 26603 30363 87079
      - name: Verify all four official parts load as real triangulated meshes
        run: |
          python - <<'PY'
          from pathlib import Path
          from lego_geometry_engine import LDrawLibrary
          lib = LDrawLibrary(Path('/tmp/lego2-078-ldraw'))
          for name in ('3005','26603','30363','87079'):
              p = lib.load_part(name)
              assert len(p.triangles) > 0, (name, 'empty_mesh')
              print('LDRAW_LOADED', name, 'triangles', len(p.triangles))
          PY
      - name: Probe six simultaneous interfaces and bounded insertion in both orientations
        run: |
          python scripts/probe_ridge_full_ldraw_078.py \
            --ldraw-root /tmp/lego2-078-ldraw \
            --output artifacts/lego2-078/real-four-piece-probe.json
      - name: Check real mesh proof is complete without claiming structural certificate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/lego2-078/real-four-piece-probe.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['complete_real_mesh_check'] is True, r['blocking_reasons']
          assert r['physical_certification'] == 'NOT_CERTIFIED'
          assert len(r['orientations']) == 2
          for orient in r['orientations']:
              assert orient['six_mesh_pairs_complete'] is True
              assert orient['insertion_mesh_pairs_complete'] is True
              assert len(orient['mesh_pair_relations']) == 6
              assert orient['evidence']['physical_certification'] == 'NOT_CERTIFIED'
          print('FOUR_PIECE_REAL_LDRAW_GEOMETRY_078=PASS')
          PY
      - name: Upload bounded LDraw evidence JSON (never a full library)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego2-078-real-four-piece-mesh-report
          path: artifacts/lego2-078/real-four-piece-probe.json
          if-no-files-found: warn
          retention-days: 21
