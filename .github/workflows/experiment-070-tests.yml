name: Experiment 070 current world visual milestone
on:
  push:
    branches: [experiment/current-world-visual-milestone-070]
  pull_request:
    branches: [experiment/property-outcome-world-mapping-069]
jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -s tests/vision/test_multiview_workspace.py -k "070 or 069 or 068 or 067 or 066 or 065 or 064"
