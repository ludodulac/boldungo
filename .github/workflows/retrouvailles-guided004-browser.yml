name: RETROUVAILLES — existing 2852-component house viewer browser test
on:
  pull_request:
    branches: [feat/lego2-visionneuse1-guided004-maison4-356]
    paths:
      - 'frontend/viewer.html'
      - 'frontend/index.html'
      - 'tests/frontend/test_retrouvailles_019_browser.py'
      - '.github/workflows/retrouvailles-guided004-browser.yml'
permissions:
  contents: read
jobs:
  one-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Playwright, Chromium only
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser with existing viewer — desktop plus phone touch
        run: python tests/frontend/test_retrouvailles_019_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RETROUVAILLES-019-REAL-CHROMIUM-PREVIEWS
          path: artifacts/retrouvailles/*.png
          retention-days: 14
          if-no-files-found: warn
