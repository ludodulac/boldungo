name: Five-photo house visual proof

on:
  pull_request:
    paths:
      - 'backend/brickhouse/survey/**'
      - 'frontend/benchmarks/real-house-5/five-photo-*'
      - 'tests/five_photo_visual_proof.py'
      - 'tests/survey/test_survey_v02_minimal_contract.py'
      - '.github/workflows/five-photo-house-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" pillow
      - name: Targeted Survey tests
        run: pytest -q tests/survey/test_survey_v02_minimal_contract.py tests/scene/test_five_photo_geometry_fidelity.py
      - name: Build candidate BrickModel
        run: python tests/five_photo_visual_proof.py
      - name: Sanity check witness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          scene=json.loads(Path('frontend/benchmarks/real-house-5/five-photo-scene-candidate-v0.4.json').read_text())
          assert scene['roofs'][0]['type']=='gable'
          assert scene['roofs'][0]['pitch_degrees'] is None
          assert not any(v['id']=='lower_exterior_volume' for v in scene['volumes'])
          export=json.loads(Path('frontend/sample-export.json').read_text())
          parts=export['brick_model']['parts']
          assert parts
          assert any(p['component']=='roof' for p in parts)
          assert any(p.get('category')=='timber' for p in parts)
          assert any(p.get('category')=='masonry' for p in parts)
          print('parts',len(parts))
          PY
      - name: Capture four real viewer angles
        run: |
          python -m http.server 8000 --directory frontend >/tmp/http.log 2>&1 &
          python - <<'PY'
          import shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('five-photo-captures'); out.mkdir()
          browser_path=next((shutil.which(n) for n in ('google-chrome','google-chrome-stable','chromium','chromium-browser') if shutil.which(n)),None)
          assert browser_path, 'No Chromium/Chrome on runner'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=browser_path,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1000})
              page.goto('http://127.0.0.1:8000/viewer.html',wait_until='networkidle')
              page.locator('#viewer').wait_for(state='visible')
              page.wait_for_timeout(1200)
              page.locator('#viewer').screenshot(path=str(out/'perspective.png'))
              for button,name in [('#view-front','front.png'),('#view-rear','rear.png'),('#view-left','left.png')]:
                  page.locator(button).click()
                  page.wait_for_timeout(500)
                  page.locator('#viewer').screenshot(path=str(out/name))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: five-photo-house-candidate-captures
          path: |
            five-photo-captures/*.png\n            five-photo-scene-projections/*.png
            frontend/sample-export.json
            frontend/benchmarks/real-house-5/five-photo-scene-candidate-v0.3.json
            frontend/benchmarks/real-house-5/five-photo-materialization-v0.1.json
