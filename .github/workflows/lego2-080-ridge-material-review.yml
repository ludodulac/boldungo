name: LEGO2-080 material occupancy review of three ridge collisions

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/ridge_material_volume_080.py'
      - 'scripts/probe_ridge_material_volume_080.py'
      - 'tests/bricks/test_ridge_material_volume_080.py'
      - '.github/workflows/lego2-080-ridge-material-review.yml'
  workflow_dispatch:

jobs:
  physical-volume-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same backend and LDraw engine as 079
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Reuse pinned LDraw subset without committing third-party files
        run: |
          python scripts/download_ldraw_probe_066.py /tmp/lego2-080-ldraw \
            --max-files 240 --parts 3005 26603 30363 87079
      - name: Test only new closure and actual material-volume logic
        run: |
          python -m pytest tests/bricks/test_ridge_material_volume_080.py -q
      - name: Inspect occupied solid shells for three previously localized pairs
        run: |
          python -m scripts.probe_ridge_material_volume_080 \
            --ldraw-root /tmp/lego2-080-ldraw \
            --output artifacts/lego2-080/material-interference-three-pairs.json
      - name: Check six bounded physical verdicts, never invent valid clutch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/lego2-080/material-interference-three-pairs.json')
          report = json.loads(p.read_text(encoding='utf-8'))
          assert report['diagnostic_executed'], report['blocking_reasons']
          assert report['relocalized_triangles'] is False
          assert report['model_mutated'] is False
          assert report['physical_certification'] == 'NOT_CERTIFIED'
          assert len(report['orientations']) == 2
          for orientation in report['orientations']:
              assert len(orientation['pair_verdicts']) == 3
              for pair in orientation['pair_verdicts']:
                  assert pair['crossings_recomputed'] is False
                  assert pair['verdict'] in {'VALID', 'INVALID', 'UNKNOWN'}
                  assert pair['physical_certification'] == 'NOT_CERTIFIED'
                  # No connector-fit / material-source proof is provided by
                  # LDraw, so this review must not certify a mechanical joint.
                  assert pair['verdict'] == 'UNKNOWN'
          print('THREE_PHYSICAL_RIDGE_INTERFERENCES_080=REVIEWED')
          PY
      - name: Upload evidence JSON only; keep full downloaded LDraw outside git
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lego2-080-ridge-material-volume-report
          path: artifacts/lego2-080/material-interference-three-pairs.json
          if-no-files-found: warn
          retention-days: 21
