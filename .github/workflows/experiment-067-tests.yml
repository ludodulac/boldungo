name: Experiment 067 missing constraint perceptual planner tests
on:
  push:
    branches: [experiment/missing-constraint-perceptual-planner-067]
  pull_request:
    branches: [experiment/multiview-world-constraint-graph-066]
jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -s tests/vision/test_multiview_workspace.py -k "067 or 066 or 065 or 064"
