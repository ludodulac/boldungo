name: LEGO2 B-2 full house actual terrace joins
on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'scripts/build_guided004_connections_b2.py'
      - 'scripts/check_b2_mesh_sample.py'
      - 'tests/bricks/test_guided004_connections_b2.py'
      - '.github/workflows/lego2-b2-connections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-house-b2-terrace-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing engine only
        run: |
          python -m pip install -e .
          python -m pip install -e ./lego_geometry_engine
          python -m pip install pytest
      - name: Real compatible and deliberately incompatible 1x3 connector
        run: python -m pytest -q tests/bricks/test_guided004_connections_b2.py
      - name: Official pinned LDraw 30363 necessary for whole roof transforms
        run: python scripts/download_ldraw_probe_066.py /tmp/ldraw-b2 --max-files 240 --parts 30363 3002 3622 3623 3008 3007
      - name: Rebuild B1 in isolated location then B2 without ever touching original
        run: |
          python scripts/build_guided004_connections_b2.py --ldraw-root /tmp/ldraw-b2 --output artifacts/lego2-b2
      - name: Check four sampled actual official LDraw mesh interfaces without claiming certification
        run: |
          python scripts/check_b2_mesh_sample.py \
            --ldraw-root /tmp/ldraw-b2 \
            --model artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/BRICKMODEL-B2-1905.json \
            --output artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/MESH-4-INTERFACE-SAMPLE.json
      - name: Assert full 1905 house, constructive terrace repair, and zero false certification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE")
          m=json.loads((p/"BEFORE-AFTER-B1-B2.json").read_text())
          bom=json.loads((p/"BOM-B2.json").read_text())
          assert (m["from_count"],m["to_count"],m["added"],m["removed"],m["moved"])==(1901,1905,4,0,0)
          assert m["b1_orthogonal_unsupported"]==42
          assert m["b1_orthogonal_components"]==26
          assert m["b1_orthogonal_collision_cells"]==m["b2_orthogonal_collision_cells"]==0
          assert m["floor_repair"]["b1_floor_components"]==[29,1]
          assert m["floor_repair"]["b2_floor_components"]==[34]
          assert m["floor_repair"]["nominal_plate_host_interfaces"]==4
          assert m["old_B1_files_unchanged"]
          assert m["b1_unverified_slopes"]==m["b2_unverified_slopes"]==408
          assert bom["total"]==1905 and sum(bom["by_ldraw_id"].values())==1905
          s=(p/"GUIDED004-B2-1905-FULL-HOUSE.ldr").read_text()
          assert sum(t.startswith("1 ") for t in s.splitlines())==1905
          order=json.loads((p/"ORDER-B2-NOT-CERTIFIED.json").read_text())
          assert order["full_house_steps"]==272
          assert m["positive_clutch_proven"]=="NO"
          sample=json.loads((p/"MESH-4-INTERFACE-SAMPLE.json").read_text())
          assert sample["checked_distinct_pairs"]==4
          assert sample["sampled_not_exhaustive"] is True
          assert sample["roof_fully_verified"]=="NO"
          print("B2_SAMPLE_MESH_4_INTERFACES_NOT_CERTIFIED")
          print("B2_1905_TRUE_LDRAW_LINES_PASS")
          print("B2_REPAIRED_SINGLE_ORPHAN_BOARD_FLOOR_COMPONENT_29_PLUS_1_TO_34_PASS")
          print("B2_B1_ALL_1901_POSITIONS_UNCHANGED_PASS")
          print("B2_408_22DEG_ROOF_TILES_UNCHANGED_PASS")
          print("B2_INVALID_PLATE_MATE_REJECTED_PASS")
          PY
      - name: Save all B1/B2 model, BOM, insertion and mesh-proof limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOLDUNGO-B2-GUIDED004-1905-TERRACE-JOINTS-NOT-CERTIFIED
          path: artifacts/lego2-b2/
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve essential finished B2 model permanently ON THE EXPERIMENTAL PR BRANCH
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          B2_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p missions/B2/generated
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/GUIDED004-B2-1905-FULL-HOUSE.ldr missions/B2/generated/
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/GUIDED004-B2-FULL-HOUSE-ISOMETRIC.svg missions/B2/generated/
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/B2-CORRECTED-DECK-JOINTS.svg missions/B2/generated/
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/BOM-B2.json missions/B2/generated/
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/BEFORE-AFTER-B1-B2.json missions/B2/generated/
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/ORDER-B2-NOT-CERTIFIED.json missions/B2/generated/
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/ALL-42-B1-CLASSIFIED.json missions/B2/generated/
          cp artifacts/lego2-b2/EXPERIMENTAL-1905-FULL-HOUSE/MESH-4-INTERFACE-SAMPLE.json missions/B2/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missions/B2/generated/
          if ! git diff --cached --quiet; then
            git commit -m "B-2: persist corrected 1905-piece full LDraw house and terrace visuals/BOM/audit on experimental PR only"
            git push origin "HEAD:refs/heads/${B2_BRANCH}"
          fi
