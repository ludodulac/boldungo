name: Scene Survey opening visual materialization check

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - 'backend/brickhouse/scene/benchmark_scene_recipe.py'
      - 'frontend/benchmarks/real-house-5/scene-candidate-v0.2.json'
      - 'frontend/benchmarks/real-house-5/accepted-survey-v0.1.json'
      - 'tests/scene/test_benchmark_scene_survey_visuals.py'
      - 'backend/brickhouse/scene/opening_visual_fidelity.py'
      - 'tests/scene/test_opening_visual_fidelity.py'
      - 'tests/survey/test_opening_visual_contract_unification.py'
      - '.github/workflows/scene-survey-opening-visual-materialization-check.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run targeted boundary regressions
        run: pytest -q tests/scene/test_benchmark_scene_survey_visuals.py tests/scene/test_opening_visual_fidelity.py tests/survey/test_opening_visual_contract_unification.py
      - name: Materialize real-house-5 and assert opening visuals
        run: |
          python scripts/materialize_scene_recipe.py frontend/benchmarks/real-house-5/scene-candidate-v0.2.json /tmp/real-house-5-scene.json
          python - <<'PY'
          import json
          from pathlib import Path
          scene = json.loads(Path('/tmp/real-house-5-scene.json').read_text())
          openings = {o['id']: o for o in scene['openings']}
          for oid in ('front-opening-1','front-opening-2','front-opening-3','front-opening-4'):
              visual = openings[oid]['opening_visual']
              assert visual['surround_relief'] == 'projecting', (oid, visual)
              assert visual['glazing_plane'] == 'recessed', (oid, visual)
              assert visual['surround_color'] == 'beige', (oid, visual)
          for oid in ('front-opening-5','front-opening-6'):
              visual = openings[oid].get('opening_visual') or {}
              assert visual.get('surround_relief') is None, (oid, visual)
              assert visual.get('glazing_plane') is None, (oid, visual)
          print('real-house-5 opening visual propagation exact')
          PY
