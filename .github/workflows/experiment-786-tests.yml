name: Experiment 786 spiral persistence
on:
  push:
    branches: [experiment/first-spatial-spiral-p2-p5]
jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -s tests/vision/test_spiral_persistence_786.py tests/vision/test_multiview_workspace.py -k "786 or 073 or 072 or 071 or 070 or 069 or 068 or 067 or 066 or 065 or 064 or 063 or 062"
