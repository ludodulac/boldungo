name: Experiment 066 world constraint graph tests
on:
  push:
    branches: [experiment/multiview-world-constraint-graph-066]
  pull_request:
    branches: [experiment/identity-negative-memory-065]
jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -s tests/vision/test_multiview_workspace.py -k "066 or 065 or 064"
