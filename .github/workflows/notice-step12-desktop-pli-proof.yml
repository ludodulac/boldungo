name: NOTICE step 12 desktop PLI proof
on:
  push:
    branches: [experiment/notice-step12-visual-action]
    paths: ['.github/workflows/notice-step12-desktop-pli-proof.yml']
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: |
          python -m http.server 4173 --directory frontend >/tmp/http.log 2>&1 &
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          await page.goto('http://127.0.0.1:4173/viewer.html?notice=step-0012&visual=action',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__NOTICE_PROOF__?.current_step==='step-0012');
          await page.locator('.viewer-wrap').screenshot({path:'step12-desktop-large-pli.png'});
          await browser.close();
          JS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: notice-step12-desktop-large-pli
          path: step12-desktop-large-pli.png
          retention-days: 14
