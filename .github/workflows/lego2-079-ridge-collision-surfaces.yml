name: LEGO2-079 localize three real ridge mesh collisions

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'scripts/diagnose_ridge_collision_surfaces_079.py'
      - 'tests/bricks/test_ridge_collision_surfaces_079.py'
      - '.github/workflows/lego2-079-ridge-collision-surfaces.yml'
  workflow_dispatch:

jobs:
  ridge-collision-zones:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and LDraw engine
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Download SAME PINNED subset of 3005 26603 30363 87079
        run: |
          python scripts/download_ldraw_probe_066.py /tmp/lego2-079-ldraw \
            --max-files 240 --parts 3005 26603 30363 87079
      - name: Localize three surface crossings with REAL LDraw triangles
        run: |
          python scripts/diagnose_ridge_collision_surfaces_079.py \
            --ldraw-root /tmp/lego2-079-ldraw \
            --output artifacts/lego2-079/ridge-three-collision-zones.json
      - name: Assert six localized collision records and conservative verdicts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/lego2-079/ridge-three-collision-zones.json')
          report=json.loads(p.read_text(encoding='utf-8'))
          assert report['complete_collision_localization'], report['blocking_reasons']
          assert len(report['orientations']) == 2
          assert report['physical_certification'] == 'NOT_CERTIFIED'
          for orientation in report['orientations']:
              assert orientation['collision_count'] == 3
              assert orientation['completion']
              assert len(orientation['pairs']) == 3
              for pair in orientation['pairs']:
                  assert pair['ldraw_mesh_relation'] == 'COLLISION'
                  assert pair['verdict'] == 'UNKNOWN'   # no mechanical fit proof
                  assert pair['witnesses']['crossing_witnesses_recorded'] > 0
                  assert pair['witnesses']['sample_envelope'] is not None
          print('THREE_REAL_RIDGE_COLLISIONS_LOCALIZED=PASS')
          PY
      - name: Preserve bounded collision witness JSON, never the library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego2-079-three-ridge-collision-zones
          path: artifacts/lego2-079/ridge-three-collision-zones.json
          if-no-files-found: warn
          retention-days: 21
