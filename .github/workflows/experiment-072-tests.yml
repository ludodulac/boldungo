name: Experiment 072 ingest global connectivity
on:
  push:
    branches: [experiment/ingest-global-connectivity-072]
  pull_request:
    branches: [experiment/global-multiview-connectivity-071]
jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -s tests/vision/test_multiview_workspace.py -k "072 or 071 or 070 or 069 or 068 or 067 or 066 or 065 or 064"
