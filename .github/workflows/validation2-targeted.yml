name: VALIDATION-2 — bounded insertion and viewer sequence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/validation2_continuous_insertion.py'
      - 'scripts/validation2_browser.py'
      - 'missions/VALIDATION2/SEQUENCE-10.json'
      - '.github/workflows/validation2-targeted.yml'
permissions:
  contents: write
concurrency:
  group: validation2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  one-targeted-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing LDraw geometry engine and Chromium
        run: |
          python -m pip install -e "./lego_geometry_engine"
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Existing pinned genuine LDraw part families, unchanged
        run: python scripts/download_ldraw_probe_066.py /tmp/validation2-ldraw --max-files 160 --parts 3811 3008 3004 3622 3009
      - name: ONE continuous analytical insertion check — all ten original placements
        run: python scripts/validation2_continuous_insertion.py --ldraw-root /tmp/validation2-ldraw
      - name: ONE Chromium mobile assembly-sequence viewer test
        run: python scripts/validation2_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VALIDATION2-TEN-TRAJECTORIES-EVIDENCE
          path: |
            missions/VALIDATION2/*.json
            missions/VALIDATION2/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: Persist exactly measured insertion evidence in DRAFT branch only
        if: success()
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missions/VALIDATION2/TRAJECTOIRES.json missions/VALIDATION2/RESULTAT.json missions/VALIDATION2/sequence-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "VALIDATION-2: record bounded continuous path evidence and viewer steps"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
