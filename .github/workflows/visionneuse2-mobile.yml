name: VISIONNEUSE-2 — status clarity and unobstructed mobile canvas
on:
  pull_request:
    branches: [feat/lego2-retrouvailles-guided004-2852-complete]
    paths:
      - 'frontend/viewer.html'
      - 'frontend/viewer.js'
      - 'frontend/styles.css'
      - 'tests/frontend/test_visionneuse2_mobile.py'
      - '.github/workflows/visionneuse2-mobile.yml'
permissions:
  contents: read
jobs:
  one-mobile-visual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing browser test runtime
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: One mobile Chromium test — complete model 019 and LEGO 356
        run: python -m pytest -q tests/frontend/test_visionneuse2_mobile.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VISIONNEUSE2-MOBILE-019-356-SCREENSHOTS
          path: artifacts/visionneuse2/*.png
          retention-days: 14
          if-no-files-found: warn
