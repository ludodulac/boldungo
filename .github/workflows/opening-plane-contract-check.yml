name: Qualitative opening plane contract check

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - 'backend/brickhouse/building/models.py'
      - 'backend/brickhouse/scene/opening_visual_fidelity.py'
      - 'tests/survey/test_opening_visual_contract_unification.py'
      - 'tests/scene/test_opening_visual_fidelity.py'
      - '.github/workflows/opening-plane-contract-check.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run targeted contract tests
        run: |
          pytest -q tests/survey/test_opening_visual_contract_unification.py
          pytest -q tests/scene/test_opening_visual_fidelity.py
      - name: Run Survey and Scene regressions
        run: pytest -q tests/survey tests/scene
