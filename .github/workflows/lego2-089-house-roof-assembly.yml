name: LEGO2-089 real-house roof connection compilation

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/roof_connectivity_compiler_089.py'
      - 'scripts/compile_guided004_roof_089.py'
      - 'tests/bricks/test_roof_connectivity_compiler_089.py'
      - '.github/workflows/lego2-089-house-roof-assembly.yml'
  workflow_dispatch:

jobs:
  real-408-slope-dependency-compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing engines only
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Verify true connector rule and wall-to-roof chain tests
        run: |
          python -m pytest -q \
            tests/bricks/test_roof_connectivity_compiler_089.py \
            tests/bricks/test_house_roof_rule_builder_088.py
      - name: Regenerate only the EXISTING real 1890-piece house
        run: python scripts/export_guided004_lego.py > guided004-existing-export.log
      - name: Generate proposed full-house ridge retiling 088, separate from canonical
        run: |
          python scripts/construct_guided004_roof_088.py \
            --source artifacts/lego2-guided-004/brick-model.json \
            --output-dir artifacts/lego2-088-guided004-EXPERIMENTAL
      - name: Compile actual roof dependency chains and conservative assembly order
        run: |
          python scripts/compile_guided004_roof_089.py \
            --canonical artifacts/lego2-guided-004/brick-model.json \
            --experimental artifacts/lego2-088-guided004-EXPERIMENTAL/GUIDED-004-EXPERIMENTAL-NOT-CERTIFIED.json \
            --output-dir artifacts/lego2-089
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/lego2-089/whole-house-roof-dependencies.json').read_text())
          assert r['canonical_part_count']==1890
          assert r['experimental_part_count']==1901
          assert r['canonical_roof']['roof_slope_parts']==408
          assert r['experimental_roof']['roof_slope_parts']==408
          assert len(r['experimental_roof']['ridge_caps'])==23
          for key in ('canonical_roof','experimental_roof'):
              item=r[key]
              assert item['source_model_mutated'] is False
              assert item['physical_certification']=='NOT_CERTIFIED'
              assert item['steps_mechanically_certified']==0
              assert item['design_gate']=='HOUSE_CONSTRUCTION_DENIED_UNVERIFIED_MATING_AND_STABILITY'
              assert item['roof_slope_grounded_nominal']+item['roof_slope_still_without_grounded_nominal_path']==408
          assert r['user_physical_trial_requested'] is False
          assert r['full_house_certificate']=='DENIED_NOT_CERTIFIED'
          print('LEGO2_089_TRUE_408_SLOPE_CONSTRUCTION_DEPENDENCIES=PASS')
          PY
      - name: Preserve actual per-piece design evidence for next construction stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGO2-089-GUIDED004-408-slope-roof-structural-design
          path: artifacts/lego2-089/
          if-no-files-found: warn
          retention-days: 30
