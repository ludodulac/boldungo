name: LEGO2-090 construct roof eave bearers across real house
on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/roof_eave_bearer_builder_090.py'
      - 'scripts/construct_guided004_eave_090.py'
      - 'tests/bricks/test_roof_eave_bearer_builder_090.py'
      - '.github/workflows/lego2-090-eave-loadbearing.yml'
  workflow_dispatch:

jobs:
  construct-real-house:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing engines
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Test eave beam geometry and second-house generality
        run: |
          python -m pytest -q tests/bricks/test_roof_eave_bearer_builder_090.py tests/bricks/test_roof_connectivity_compiler_089.py
      - name: Rebuild canonical only as read-only input
        run: python scripts/export_guided004_lego.py > guided004-existing-export.log
      - name: Regenerate independent 088 ridge experiment
        run: |
          python scripts/construct_guided004_roof_088.py \
            --source artifacts/lego2-guided-004/brick-model.json \
            --output-dir artifacts/lego2-088-guided004-EXPERIMENTAL
      - name: Build separate house-wide experimental eave-bearing model
        run: |
          python scripts/construct_guided004_eave_090.py \
            --canonical artifacts/lego2-guided-004/brick-model.json \
            --previous artifacts/lego2-088-guided004-EXPERIMENTAL/GUIDED-004-EXPERIMENTAL-NOT-CERTIFIED.json \
            --output artifacts/lego2-090
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/lego2-090/eave-assembly-090.json").read_text())
          assert data["canonical_parts"] == 1890
          assert data["previous_experimental_parts"] == 1901
          assert data["canonical_model_mutated"] is False
          assert data["bracket_count"] >= 1
          assert data["physical_certification"] == "NOT_CERTIFIED"
          assert data["roof_cavity_connections_mechanically_proven"] == 0
          assert data["after"]["unreached"] < data["before"]["unreached"]
          assert data["user_physical_test_requested"] is False
          print("LEGO2_090_CONSTRUCTION_PASS_NOT_CERTIFIED")
          PY
      - name: Upload actual model, BOM, and detailed construction blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGO2-090-guided004-eave-structure-experimental
          path: artifacts/lego2-090/
          if-no-files-found: warn
          retention-days: 30
