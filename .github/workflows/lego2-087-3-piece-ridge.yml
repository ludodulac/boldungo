name: LEGO2-087 constructive two-sided three-piece ridge

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/roof_joint_module_087.py'
      - 'tests/bricks/test_roof_joint_module_087.py'
      - 'scripts/build_ridge_trial_087.py'
      - '.github/workflows/lego2-087-3-piece-ridge.yml'
  workflow_dispatch:

jobs:
  join-two-real-slopes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine and LDraw geometry
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e ./lego_geometry_engine
      - name: Fetch only the two part families actually being tested
        run: |
          python scripts/download_ldraw_probe_066.py \
            artifacts/lego2-087/ldraw \
            --max-files 130 --parts 30363 3003 3002
      - name: Test 3-piece 2-sided nominal stud alignment + new LDraw seam
        env:
          LDRAW_TEST_ROOT_087: artifacts/lego2-087/ldraw
        run: |
          python -m pytest -q tests/bricks/test_roof_joint_module_087.py
      - name: Export only candidates passing selected scoped screens
        run: |
          python scripts/build_ridge_trial_087.py \
            --ldraw-root artifacts/lego2-087/ldraw \
            --output-dir artifacts/lego2-087/physical-mini-ridge
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/lego2-087/physical-mini-ridge')
          report=json.loads((root/'candidate-decisions.json').read_text())
          assert report['candidates_tested']==4
          assert report['physical_certification']=='NOT_CERTIFIED'
          assert report['canonical_model_changed'] is False
          for row in report['candidates']:
              assert row['part_count']==3
              assert len(row['joint_plan'])==2
              assert len(row['ldraw']['pair_checks'])==3
          chosen=report['recommended_experiment_id']
          if chosen:
              sheet=(root/'ESSAI-3-PIECES.md').read_text()
              visual=(root/'essai-faitage-3-pieces-NOT-CERTIFIED.ldr').read_text()
              assert visual.count('0 STEP')==3
              assert sum(s.startswith('1 ') for s in visual.splitlines())==3
              assert 'NOT_CERTIFIED' in sheet
              print('LEGO2_087_FIRST_TWO_SLOPE_BRIDGE=EXPERIMENT_READY')
          else:
              assert (root/'AUCUN-MONTAGE-APPROUVE.txt').is_file()
              print('LEGO2_087_FIRST_TWO_SLOPE_BRIDGE=NO_APPROVED_CANDIDATE')
          PY
      - name: Upload only outcome + reference placement geometry, never official DAT assets
        uses: actions/upload-artifact@v4
        with:
          name: LEGO2-087-3-piece-ridge-fit-trial
          path: artifacts/lego2-087/physical-mini-ridge/
          if-no-files-found: error
          retention-days: 30
