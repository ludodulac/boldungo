name: LEGO2 S-1 official-inspired 20-part bearing frame
on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - "scripts/build_documented_frame_s1.py"
      - "tests/bricks/test_documented_frame_s1.py"
      - ".github/workflows/lego2-s1-bearing-frame.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-20part-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal tooling and existing official geometry engine
        run: |
          python -m pip install pytest
          python -m pip install -e ./lego_geometry_engine
      - name: FAST test exact 20-part construction and intentionally bad connection
        run: python -m pytest -q tests/bricks/test_documented_frame_s1.py
      - name: Download pinned original official LDraw closure for ONLY 4 actual designs
        run: |
          python scripts/download_ldraw_probe_066.py /tmp/s1-official --max-files 200 --parts 91405 3003 3006 3832
      - name: Build exactly ONE model and mesh-check every intended connector + representatives
        run: |
          python scripts/build_documented_frame_s1.py --ldraw-root /tmp/s1-official --output artifacts/s1-frame
      - name: Assert accurate count, consistent paths and honest unproven geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/s1-frame")
          bom=json.loads((p/"NOMENCLATURE.json").read_text())
          report=json.loads((p/"PREUVES-GEOMETRIE.json").read_text())
          order=json.loads((p/"MONTAGE.json").read_text())
          routes=json.loads((p/"CHEMIN-D-APPUI.json").read_text())
          s=report["summary"]
          assert bom["total"]==20
          assert bom["by_ldraw_reference"]=={"3003":12,"3006":2,"3832":5,"91405":1}
          assert len(order["build_order"])==20
          assert s["edges_planned"]==26 and s["nominal_wrong_pairs"]==0
          assert s["sampled_mesh_class_count"]==4
          assert len(routes["per_floor_plate_routes"])==5
          assert all(x[-1]=="S1-BASE" for x in routes["per_floor_plate_routes"].values())
          assert s["strength_certified"] is False and s["insertion_proven"] is False
          assert sum(line.startswith("1 ") for line in (p/"S1-OSSATURE.ldr").read_text().splitlines())==20
          print("S1_20_GENUINE_OFFICIAL_LDRAW_PARTS_AND_BOM_PASS")
          print("S1_26_EXACT_NOMINAL_FOUR_STUD_ALIGNMENTS_PASS")
          print("S1_ALL_FIVE_FLOOR_TO_BASE_GRAPH_PATHS_PASS")
          print("S1_NOT_A_CERTIFICATION_PASS")
          PY
      - name: Save geometry and order, even when mesh proof remains inconclusive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOLDUNGO-S1-20-PART-OFFICIAL-INSPIRED-FRAME-NOT-CERTIFIED
          path: artifacts/s1-frame/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist the actual constructed model, preview, BOM and geometric proof in this DRAFT branch
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          S1_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p missions/S1/generated
          cp artifacts/s1-frame/* missions/S1/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missions/S1/generated/
          if ! git diff --cached --quiet; then
            git commit -m "S-1: version actual 20-piece LDraw frame, visible 3D, BOM, assembly, chain and official geometry checks"
            git push origin "HEAD:refs/heads/${S1_BRANCH}"
          fi
