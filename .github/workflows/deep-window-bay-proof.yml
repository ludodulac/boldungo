name: Deep LEGO window bay proof

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'backend/brickhouse/bricks/windows.py'
      - 'backend/brickhouse/bricks/facade_details.py'
      - 'backend/brickhouse/bricks/brick_model.py'
      - 'tests/deep_window_bay_proof.py'
      - '.github/workflows/deep-window-bay-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install playwright
      - name: Generate matched prototype exports
        run: |
          python tests/deep_window_bay_proof.py 0
          python tests/deep_window_bay_proof.py 1
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/deep-bay-proof')
          for n in ('before','after'):
              d=json.loads((p/f'{n}.json').read_text())
              print(n,d['bom']['total_parts'])
          PY
      - name: Capture matched face and three-quarter views
        run: python tests/deep_window_bay_proof.py capture
      - name: Verify four captures exist
        run: |
          test -s /tmp/deep-bay-proof/before-front.png
          test -s /tmp/deep-bay-proof/after-front.png
          test -s /tmp/deep-bay-proof/before-perspective.png
          test -s /tmp/deep-bay-proof/after-perspective.png
      - uses: actions/upload-artifact@v4
        with:
          name: deep-window-bay-before-after
          path: |
            /tmp/deep-bay-proof/*.json
            /tmp/deep-bay-proof/*.png
          if-no-files-found: error
          retention-days: 14
