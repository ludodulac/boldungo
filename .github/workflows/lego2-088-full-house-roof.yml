name: LEGO2-088 actual full-house rule-based roof candidate

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/house_roof_rule_builder_088.py'
      - 'backend/brickhouse/bricks/house_ridge_strip_retile_088.py'
      - 'scripts/construct_guided004_roof_088.py'
      - 'tests/bricks/test_house_roof_rule_builder_088.py'
      - 'tests/bricks/test_house_ridge_strip_retile_088.py'
      - '.github/workflows/lego2-088-full-house-roof.yml'
  workflow_dispatch:

jobs:
  construct-actual-house:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing LEGO2 engines (NO replacement engine)
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Test ALL orientations, obstacles and canonical immutability
        run: |
          python -m pytest -q tests/bricks/test_house_roof_rule_builder_088.py \
            tests/bricks/test_roof_joint_module_087.py
      - name: Generate unchanged full GUIDED-004 canonical with existing exporter
        run: |
          python scripts/export_guided004_lego.py > guided004-088-existing-export.log
          python - <<'PY'
          from pathlib import Path
          from brickhouse.bricks.brick_model import BrickModel
          f=Path('artifacts/lego2-guided-004/brick-model.json')
          model=BrickModel.model_validate_json(f.read_text())
          assert len(model.parts)==1890
          print('LEGO2_088_CANONICAL_EXPORT_1890=PASS')
          PY
      - name: DESIGN house-wide ridge without editing canonical or requesting physical trial
        run: |
          python scripts/construct_guided004_roof_088.py \
            --source artifacts/lego2-guided-004/brick-model.json \
            --output-dir artifacts/lego2-088-guided004-EXPERIMENTAL
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          source=Path('artifacts/lego2-guided-004/brick-model.json')
          out=Path('artifacts/lego2-088-guided004-EXPERIMENTAL')
          r=json.loads((out/'CONSTRUCTION-DECISION-088.json').read_text())
          assert r['source_sha256']==hashlib.sha256(source.read_bytes()).hexdigest()
          assert r['canonical_piece_count_confirmed']==1890
          assert r['canonical_model_unchanged'] and r['canonical_file_unchanged']
          assert r['user_physical_test_required_for_this_mission'] is False
          assert r['approved_house_notice_emitted'] is False
          assert r['house_assembly_permission']=='DENIED_BY_FAIL_CLOSED_RULES'
          assert r['construction_status']=='BLOCKED_NOT_YET_BUILDABLE'
          assert r['physical_certification']=='NOT_CERTIFIED'
          delta=json.loads((out/'EXPERIMENTAL-BOM-DELTA.json').read_text())
          assert delta['part_count_original']==1890
          if r['candidate_caps_proposed']:
              model=json.loads((out/'GUIDED-004-EXPERIMENTAL-NOT-CERTIFIED.json').read_text())
              assert len(model['parts'])==r['generated_experimental_part_count']
              assert model['building_id'].endswith('-EXPERIMENTAL-088')
              assert len(model['parts'])==1890+sum(delta['net_delta_by_canonical_part_id'].values())
          else:
              assert not (out/'GUIDED-004-EXPERIMENTAL-NOT-CERTIFIED.json').exists()
          print('LEGO2_088_REAL_HOUSE_NONDESTRUCTIVE_CONSTRUCTION=PASS')
          PY
      - name: Upload actual design decision and possible experimental alternative
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGO2-088-GUIDED004-house-wide-roof-design-NOT-CERTIFIED
          path: artifacts/lego2-088-guided004-EXPERIMENTAL/
          if-no-files-found: warn
          retention-days: 30
