name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine[dev]"

      - name: Run application tests
        run: pytest -q

      - name: Install BH-231 browser driver
        run: python -m pip install 'playwright>=1.50,<2'

      - name: Prove returning benchmark browser stays responsive
        run: python tests/browser_bh231_returning_benchmark.py
      - name: Prove project photo intake survives reload
        run: python tests/browser_project_photo_intake_080.py

      - name: Run geometry engine tests
        run: pytest -q lego_geometry_engine/tests

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/viewer.js
          node --check frontend/instructions.js
          node --check frontend/configurator.js
          node --check frontend/photo.js
          node --check frontend/photo-simple.js
          node --check frontend/photo-shell-loader.js
          node --check frontend/photo-shell.js
          node --check frontend/project-photo-store.js
          node --check frontend/photo-capture-runtime.js
          node --check frontend/brickhouse-survey-hybrid-pdf.js
          node --check frontend/brickhouse-single-package.js
          node --check frontend/brickhouse-survey-package.js
          node --check frontend/external-bundle-import.js
          node --check frontend/survey-import.js
          node --check frontend/scene-handoff-contract-audit-v44.js
          node --check frontend/scene-handoff-photo-evidence.js
          node --check frontend/scene-survey-gate.js
          node --check frontend/scene-build.js
          node --check frontend/brickhouse-rich-scene-preview.js

      - name: Verify Boldungo phone shell is wired and HUD-only
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('frontend/photo.html').read_text(encoding='utf-8')
          package = Path('frontend/brickhouse-survey-package.js').read_text(encoding='utf-8')
          loader = Path('frontend/photo-shell-loader.js').read_text(encoding='utf-8')
          shell = Path('frontend/photo-shell.js').read_text(encoding='utf-8')
          css = Path('frontend/photo-shell.css').read_text(encoding='utf-8')

          assert 'brickhouse-survey-package.js' in html
          assert 'photo-shell-loader.js' in html
          assert 'single-screen-0.8-project-flow' in loader
          assert 'photo-shell.css' in loader and 'photo-shell.js' in loader
          assert "const stateOrder = ['photos', 'survey', 'scene', 'model']" in shell
          assert "photoCard.className='shell-main-card shell-photo-card'" in shell
          assert "photoScroll.className='shell-photo-scroll'" in shell
          assert 'move(projectIntake,photoScroll)' in shell
          assert 'move(guidedGrid,photoScroll)' in shell
          assert '[viewsCard,resultPanel,handoffCard,factsCard,detailsCard,advanced,futureCard].forEach(node=>move(node,drawerScroll))' in shell
          assert 'id="shell-help-button"' in shell
          assert "sceneCard.className='shell-main-card shell-scene-card'" in shell
          assert "feedback.id='shell-feedback'" in shell
          assert 'Lecture…' in shell and 'Vérification…' in shell
          assert "body.boldungo-shell-enabled{height:100dvh;overflow:hidden" in css
          assert ".shell-state-panel{height:100%;min-height:0;overflow:hidden" in css
          assert ".shell-photo-scroll{min-height:0;overflow-y:auto" in css
          assert ".shell-photo-card .guided-photo-grid{height:auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(116px,auto)" in css
          assert ".shell-drawer-scroll{overflow:auto" in css
          assert '.shell-state-panel{height:100%;overflow:auto' not in css
          assert '#result{height:100%;overflow:auto' not in css
          PY

      - name: Verify Survey to Scene handoff is exposed
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('frontend/photo.html').read_text(encoding='utf-8')
          survey_import = Path('frontend/survey-import.js').read_text(encoding='utf-8')
          package = Path('frontend/brickhouse-survey-package.js').read_text(encoding='utf-8')
          evidence = Path('frontend/scene-handoff-photo-evidence.js').read_text(encoding='utf-8')
          audit = Path('frontend/scene-handoff-contract-audit-v44.js').read_text(encoding='utf-8')
          prompt = Path('frontend/brickhouse-survey-to-scene-prompt.txt').read_text(encoding='utf-8')

          assert 'id="scene-handoff-home"' in html
          assert 'Créer le fichier Survey → Scene à envoyer à l’IA' in survey_import
          assert "SCENE_HANDOFF_VERSION = 'scene-handoff-0.1'" in survey_import
          assert "SCENE_HANDOFF_VERSION = 'scene-handoff-0.5-single-hybrid-pdf'" in evidence
          assert 'Créer le PDF unique Survey → Scene' in evidence
          assert "const PROMPT_VERSION = '4.3'" in evidence
          assert 'BRICKHOUSE-SURVEY-TO-SCENE-pdf-handoff-0.2.pdf' in evidence
          assert 'start_elevation:null' in prompt
          assert 'end_elevation:null' in prompt
          assert 'scene-handoff-contract-audit-v44.js' in package
          assert 'SURVEY → SCENE STRICT OUTPUT AUDIT v4.4' in audit
          assert prompt.startswith('BRICKHOUSE — PROMPT DE RECONSTRUCTION SURVEY → SCENE v4.3')
          PY

      - name: Run reference M0 pipeline
        run: brickhouse-m0 docs/examples/building-model-simple-house.json /tmp/brickhouse-house-export.json --front-width-studs 48

      - name: Verify export exists
        run: test -s /tmp/brickhouse-house-export.json

      - name: Generate generic shed viewer reference
        run: brickhouse-m0 docs/examples/building-model-shed-house.json /tmp/brickhouse-shed-viewer-export.json --front-width-studs 48

      - name: Verify shed viewer reference
        run: |
          test -s /tmp/brickhouse-shed-viewer-export.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/brickhouse-shed-viewer-export.json').read_text())
          parts = data['brick_model']['parts']
          assert any(part.get('roof_side') == 'slope' for part in parts)
          assert not any(part.get('category') == 'ridge_tile' for part in parts)
          assert any(part['placement_id'].startswith('shed-wall-') for part in parts)
          assert data['bom']['total_parts'] == len(parts)
          PY

      - name: Upload shed viewer reference
        uses: actions/upload-artifact@v4
        with:
          name: brickhouse-shed-viewer-export
          path: /tmp/brickhouse-shed-viewer-export.json
          if-no-files-found: error
          retention-days: 14

      - name: Run rich ArchitecturalScene pipeline smoke test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brickhouse.pipeline import run_m0_pipeline_scene
          from brickhouse.scene import ArchitecturalScene

          path = Path('docs/examples/architectural-scene-rich-exterior.json')
          scene = ArchitecturalScene.model_validate_json(path.read_text(encoding='utf-8'))
          bundle = run_m0_pipeline_scene(scene, front_width_studs=48)
          parts = bundle.brick_model.parts
          ids = [part.placement_id for part in parts]
          assert any(value.startswith('scene-platform:deck:') for value in ids)
          assert any(value.startswith('scene-stair:deck_stair:') for value in ids)
          assert any(value.startswith('scene-terrain:right:') for value in ids)
          assert bundle.bom.total_parts == len(parts)
          output = Path('/tmp/brickhouse-rich-scene-export.json')
          output.write_text(json.dumps(bundle.model_dump(mode='json'), indent=2), encoding='utf-8')
          PY

      - name: Verify rich Scene export exists
        run: test -s /tmp/brickhouse-rich-scene-export.json

      - name: Upload rich Scene viewer reference
        uses: actions/upload-artifact@v4
        with:
          name: brickhouse-rich-scene-viewer-export
          path: /tmp/brickhouse-rich-scene-export.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate real-house-5 viewer reference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brickhouse.partial_scene_pipeline import run_partial_scene_pipeline
          from brickhouse.scene.benchmark_scene_recipe import materialize_scene_recipe

          recipe = Path('frontend/benchmarks/real-house-5/scene-candidate-v0.2.json')
          scene = materialize_scene_recipe(recipe)
          bundle = run_partial_scene_pipeline(scene, front_width_studs=48)
          parts = bundle.brick_model.parts
          ids = [part.placement_id for part in parts]
          assert parts
          assert bundle.bom.total_parts == len(parts)
          assert bundle.assembly_plan is not None and bundle.assembly_plan.steps
          assert any(value.startswith('scene-platform:platform-timber-1:') for value in ids)
          assert any('stair-exterior-1-run-lower-v1' in value for value in ids)
          assert any('stair-exterior-1-run-upper-v1' in value for value in ids)
          Path('/tmp/brickhouse-real-house-5-viewer-export.json').write_text(
              json.dumps(bundle.model_dump(mode='json'), indent=2), encoding='utf-8'
          )
          PY

      - name: Verify real-house-5 viewer reference
        run: test -s /tmp/brickhouse-real-house-5-viewer-export.json

      - name: Upload real-house-5 viewer reference
        uses: actions/upload-artifact@v4
        with:
          name: brickhouse-real-house-5-viewer-export
          path: /tmp/brickhouse-real-house-5-viewer-export.json
          if-no-files-found: error
          retention-days: 14
