name: Materialize NOTICE 1-34 reference

on:
  push:
    branches: [feature/notice-reconstructed-steps-1-34]
    paths: ['.github/workflows/materialize-notice-1-34.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download preserved reconstruction artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10605980550/zip > /tmp/reconstruction.zip
          mkdir -p /tmp/reconstruction
          unzip -q /tmp/reconstruction.zip -d /tmp/reconstruction
      - name: Derive exact AssemblySteps 1-34 presentation bundle
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          src=Path('/tmp/reconstruction/viewer-bundle.json')
          b=json.loads(src.read_text())
          steps=b['assembly_plan']['steps'][:34]
          ids=[pid for s in steps for pid in s['placement_ids']]
          wanted=set(ids)
          parts=[p for p in b['brick_model']['parts'] if p['placement_id'] in wanted]
          counts=Counter((p['part_id'],p['category'],p.get('semantic_color')) for p in parts)
          lines=[]
          for (part_id,category,color),quantity in sorted(counts.items()):
              line={'part_id':part_id,'category':category,'quantity':quantity}
              if color is not None: line['semantic_color']=color
              lines.append(line)
          out={k:b[k] for k in ('schema_version','building_id','volume_id','scale') if k in b}
          out['brick_model']={**b['brick_model'],'parts':parts}
          out['bom']={'schema_version':'0.1','building_id':b['building_id'],'volume_id':b['volume_id'],'total_parts':len(parts),'unique_part_types':len(lines),'lines':lines}
          out['assembly_plan']={**b['assembly_plan'],'steps':steps,'total_steps':34,'total_parts':len(parts)}
          out['fidelity_issues']=b.get('fidelity_issues',[])
          out['capability_summary']=b.get('capability_summary',{})
          out['notice_reconstruction_provenance']={
            'source':'docs/examples/building-model-simple-house.json',
            'front_width_studs':16,
            'run_id':35511101561,
            'status':'compatible_reconstruction_not_historical_original',
            'brick_model_sha256':'bf31eec2c4b11c28800f206a71924b6910f1d3b99cc0fa2ed9931610fef4db23',
            'assembly_plan_sha256':'3b9b8cb1ba4dc8927656ce9a1ad1195b98019ad899cc018ec238e973661246b3'
          }
          Path('frontend/notice-reconstructed-steps-1-34-export.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          assert len(parts)==len(ids)==78
          assert [s['sequence'] for s in steps]==list(range(1,35))
          PY
      - name: Commit derived reference bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/notice-reconstructed-steps-1-34-export.json
          git commit -m "testdata: materialize reconstructed NOTICE steps 1-34"
          git push
