name: LEGO2 S-3 first 47-piece storey using S-1/S-2
on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - "scripts/build_upper_floor_s3.py"
      - "tests/bricks/test_first_storey_s3.py"
      - ".github/workflows/lego2-s3-first-storey.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construct-one-small-storey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing LDraw geometry engine and small test runner
        run: |
          python -m pip install pytest
          python -m pip install -e ./lego_geometry_engine
      - name: FAST — two walls, original S-1 intact, 40 support links and negative shifted beam
        run: python -m pytest -q tests/bricks/test_first_storey_s3.py
      - name: Fetch pinned original LDraw pieces for new interfaces only
        run: |
          python scripts/download_ldraw_probe_066.py /tmp/s3-ldraw --max-files 150 --parts 91405 3003 3006 3832
      - name: Build real 47-piece LDraw storey with two walls, upper beams and deck
        run: |
          python scripts/build_upper_floor_s3.py --ldraw-root /tmp/s3-ldraw --output artifacts/s3-first-storey
      - name: Assert 47/27 piece structure and real connectors with bounded geometrical claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/s3-first-storey")
          bom=json.loads((p/"S3-NOMENCLATURE.json").read_text())
          report=json.loads((p/"S3-CONTROLES-CONNEXIONS.json").read_text())["summary"]
          routes=json.loads((p/"S3-CHEMINS-APPUI.json").read_text())
          assert (bom["total"],bom["original_unchanged"],bom["added"])==(47,20,27)
          assert bom["by_ldraw"]=={"3003":32,"3006":4,"3832":10,"91405":1}
          assert report["new_support_edges"]==40
          assert report["new_edges_with_four_real_stud_centres"]==40
          assert report["new_edges_with_engine_recognized_connectors"]==40
          assert report["new_body_AABB_overlaps"]==0
          assert len(routes["upper_floor_paths"])==5
          assert all(q[-1]=="S1-BASE" for q in routes["upper_floor_paths"].values())
          assert report["physical_stability_certified"] is False
          assert report["full_path_47_piece_continuous_insertions_proven"] is False
          ldraw=(p/"S3-PETIT-ETAGE-47-PIECES.ldr").read_text()
          assert sum(line.startswith("1 ") for line in ldraw.splitlines())==47
          print("S3_ONE_REAL_47_PART_2_WALL_STOREY_PASS")
          print("S3_20_S1_ORIGINAL_PLACEMENTS_PRESERVED_PASS")
          print("S3_40_NEW_GENUINE_CONNECTOR_LOCATIONS_PASS")
          print("S3_5_UPPER_FLOOR_TO_BASE_NOMINAL_PATHS_PASS")
          print("S3_NO_PHYSICAL_CERTIFICATION_PASS")
          PY
      - name: Save tested model and evidence (even on partial failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOLDUNGO-S3-FIRST-47-PIECE-STOREY-EXPERIMENTAL
          path: artifacts/s3-first-storey/
          retention-days: 30
          if-no-files-found: warn
      - name: Permanently preserve model, 3D view, BOM and only new-mate evidence
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p missions/S3/generated
          cp artifacts/s3-first-storey/* missions/S3/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missions/S3/generated/
          if ! git diff --cached --quiet; then
            git commit -m "S-3: preserve first 47-piece LEGO upper storey and authentic new connector evidence"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi
