name: Real-house-5 opening truth regression

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - '.github/workflows/real-house-5-opening-truth-regression.yml'
      - 'frontend/benchmarks/real-house-5/accepted-survey-v0.1.json'
      - 'frontend/benchmarks/real-house-5/scene-candidate-v0.2.json'
      - 'backend/brickhouse/scene/benchmark_scene_recipe.py'
      - 'backend/brickhouse/scene/opening_visual_fidelity.py'
      - 'tests/scene/test_benchmark_scene_survey_visuals.py'
      - 'tests/scene/test_opening_visual_fidelity.py'
      - 'tests/survey/test_opening_visual_contract_unification.py'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Targeted Survey to Scene opening truth regression
        run: |
          pytest -q \
            tests/scene/test_benchmark_scene_survey_visuals.py \
            tests/scene/test_opening_visual_fidelity.py \
            tests/survey/test_opening_visual_contract_unification.py
