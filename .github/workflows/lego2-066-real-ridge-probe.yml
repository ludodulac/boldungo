name: LEGO2-066 real LDraw ridge mesh probe

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/ridge_proposal_3d_066.py'
      - 'scripts/probe_ridge_066.py'
      - 'scripts/download_ldraw_probe_066.py'
      - 'tests/bricks/test_ridge_proposal_3d_066.py'
      - '.github/workflows/lego2-066-real-ridge-probe.yml'
  workflow_dispatch:

jobs:
  probe-ridge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engines and dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Regenerate canonical house for measured experiment
        run: python scripts/export_guided004_lego.py > /tmp/lego2-066-export.log
      - name: Fetch pinned official-mirror LDraw dependency closure
        run: python scripts/download_ldraw_probe_066.py /tmp/lego2-066-ldraw --max-files 180
      - name: Run true-mesh probe for one proposed 2-sided ridge bridge
        run: |
          python scripts/probe_ridge_066.py artifacts/lego2-guided-004/brick-model.json \
            --ldraw-root /tmp/lego2-066-ldraw --max-tiles 1 \
            --output artifacts/lego2-066/ridge-probe.json
      - name: Check probe really analyzed three genuine mesh interfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/lego2-066/ridge-probe.json').read_text())
          assert r['proposals_checked'] == 1
          sample = r['sample'][0]
          assert len(sample['tile_to_slopes']) == 2
          assert len(sample['opposing_slopes']) == 1
          relations = sample['tile_to_slopes'] + sample['opposing_slopes']
          assert all(pair.get('mesh_relation') in ('SEPARATED','CONTACT','COLLISION') for pair in relations), relations
          assert r['physical_certification'] == 'NOT_CERTIFIED'
          print('RIDGE_066_REAL_MESH_PROBE=PASS')
          print('RIDGE_066_RELATIONS=', [p['mesh_relation'] for p in relations])
          PY
      - name: Upload ridge 3D evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego2-066-ridge-real-mesh
          path: artifacts/lego2-066/ridge-probe.json
          if-no-files-found: warn
          retention-days: 21
