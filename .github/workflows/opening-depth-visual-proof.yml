name: Opening depth visual proof

on:
  pull_request:
    paths:
      - 'backend/brickhouse/bricks/opening_depth_prototype.py'
      - 'tests/bricks/test_opening_depth_prototype.py'
      - 'tests/visual_opening_depth_proof.py'
      - '.github/workflows/opening-depth-visual-proof.yml'

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and browser helper
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install 'playwright>=1.50,<2'
      - name: Run targeted prototype tests
        run: pytest -q tests/bricks/test_opening_depth_prototype.py
      - name: Generate matched real-pipeline exports
        run: python tests/visual_opening_depth_proof.py generate
      - name: Capture matched front and three-quarter views
        run: python tests/visual_opening_depth_proof.py capture
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: opening-depth-before-after
          path: |
            /tmp/opening-depth-proof/before-front.png
            /tmp/opening-depth-proof/after-front.png
            /tmp/opening-depth-proof/before-three-quarter.png
            /tmp/opening-depth-proof/after-three-quarter.png
            /tmp/opening-depth-proof/parts.txt
          if-no-files-found: error
          retention-days: 14
