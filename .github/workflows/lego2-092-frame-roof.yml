name: LEGO2-092 full-house girder, refined roof silhouette and visual controls
on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/roof_girder_skin_092.py'
      - 'scripts/construct_guided004_roof_092.py'
      - 'scripts/render_guided004_views_092.py'
      - 'tests/bricks/test_roof_girder_skin_092.py'
      - '.github/workflows/lego2-092-frame-roof.yml'
  workflow_dispatch:
jobs:
  full-house:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing engines
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Run new and previous construction tests
        run: |
          python -m pytest -q tests/bricks/test_roof_girder_skin_092.py tests/bricks/test_roof_studdeck_designer_091.py
      - name: Regenerate real canonical house
        run: python scripts/export_guided004_lego.py > house-canonical.log
      - name: Rebuild unmodified experiment 088
        run: |
          python scripts/construct_guided004_roof_088.py --source artifacts/lego2-guided-004/brick-model.json --output-dir artifacts/lego2-088-guided004-EXPERIMENTAL
      - name: Rebuild unmodified experiment 090
        run: |
          python scripts/construct_guided004_eave_090.py --canonical artifacts/lego2-guided-004/brick-model.json --previous artifacts/lego2-088-guided004-EXPERIMENTAL/GUIDED-004-EXPERIMENTAL-NOT-CERTIFIED.json --output artifacts/lego2-090
      - name: Rebuild unmodified experiment 091
        run: |
          python scripts/construct_guided004_roof_091.py --canonical artifacts/lego2-guided-004/brick-model.json --previous-088 artifacts/lego2-088-guided004-EXPERIMENTAL/GUIDED-004-EXPERIMENTAL-NOT-CERTIFIED.json --previous-090 artifacts/lego2-090/GUIDED-004-EXPERIMENTAL-090-NOT-CERTIFIED.json --output artifacts/lego2-091
      - name: Actually construct experimental roof girder and roof skin on house
        run: |
          python scripts/construct_guided004_roof_092.py --canonical artifacts/lego2-guided-004/brick-model.json --v088 artifacts/lego2-088-guided004-EXPERIMENTAL/GUIDED-004-EXPERIMENTAL-NOT-CERTIFIED.json --v090 artifacts/lego2-090/GUIDED-004-EXPERIMENTAL-090-NOT-CERTIFIED.json --v091 artifacts/lego2-091/GUIDED-004-EXPERIMENTAL-STUDDED-ROOF-091-NOT-CERTIFIED.json --output artifacts/lego2-092
      - name: Render true full-house 091 vs 092 actual model views
        run: |
          python scripts/render_guided004_views_092.py --source artifacts/lego2-092/GUIDED-004-EXPERIMENTAL-092-NOT-CERTIFIED.json --previous artifacts/lego2-091/GUIDED-004-EXPERIMENTAL-STUDDED-ROOF-091-NOT-CERTIFIED.json --output artifacts/lego2-092/views/
      - name: Validate source invariants and deny false certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/lego2-092/CHARPENTE-TOITURE-092-EVIDENCES.json').read_text())
          assert r['source_count']==[1890,1901,1909,1936]
          assert r['prior_architecture_preserved']
          assert r['physical_certification']=='NOT_CERTIFIED'
          assert r['load_rated_connectors']==0
          assert r['girder_load_capacity'].startswith('NO_SPAN')
          assert r['skin_improved_deck_bricks']>0
          assert r['skin_max_riser_plates_exposed']==1
          assert not r['roof_skin_truly_planar']
          assert r['remaining_unproven_tension_dependent_roof_ids_count']>=2
          assert len(list(Path('artifacts/lego2-092/views').glob('*.svg')))==7
          print('LEGO2_092_PROPOSAL_BUILT_VIEWS_READY_NOT_CERTIFIED')
          PY
      - name: Upload precise experimental variant, BOM, connections and seven generated actual model views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGO2-092-GUIDED004-structural-proposal-and-visual-evidence
          path: artifacts/lego2-092/
          retention-days: 30
          if-no-files-found: warn
