name: Scene checkpoint experiment

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - '.github/workflows/scene-checkpoint-experiment.yml'

permissions:
  contents: read

jobs:
  chimney-recognition-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Boldungo and browser adapter
        run: |
          python -m pip install -e .
          python -m pip install 'playwright>=1.50,<2'
      - name: Rebuild protected current experimental hypothesis
        run: |
          python scripts/materialize_scene_recipe.py frontend/benchmarks/real-house-5/scene-candidate-v0.2.json .checkpoints/current.json
          python scripts/prepare_visual_sensitivity_sweep.py .checkpoints/current.json .checkpoints/variants
          python scripts/prepare_south_terrace_guardrail_gate.py .checkpoints/variants/combined-6.5-62-terrace-footprint.json .checkpoints/variants/terrace-guardrail.json
          python scripts/prepare_south_terrace_structure_gate.py .checkpoints/variants/terrace-guardrail.json .checkpoints/variants/pre-front.json
          python scripts/prepare_front_lower_register_gate.py .checkpoints/variants/pre-front.json .checkpoints/variants/current.json
      - name: Render CURRENT multiview
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current.json front .checkpoints/current-front.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current.json perspective .checkpoints/current-perspective.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current.json rear-oblique .checkpoints/current-rear-oblique.png --stepped-stairs
      - name: Apply one viewer-only correction using existing Scene chimney geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/scene-viewer.js')
          s = p.read_text()
          marker = 'function renderPlatforms() {'
          assert marker in s
          addition = '''function renderChimneys() {
            for (const chimney of currentScene.chimneys ?? []) {
              const p = chimney.position;
              const width = Number(chimney.width), depth = Number(chimney.depth), height = Number(chimney.height);
              if (!p || ![Number(p.x), Number(p.y), Number(p.z), width, depth, height].every(Number.isFinite)) continue;
              if (!(width > 0 && depth > 0 && height > 0)) continue;
              const geometry = new THREE.BoxGeometry(width, height, depth);
              const mesh = new THREE.Mesh(geometry, wallMaterial);
              addEdges(mesh);
              mesh.position.set(Number(p.x) + width / 2, Number(p.z) + height / 2, Number(p.y) + depth / 2);
              mesh.userData.architecturalObjectId = chimney.id;
              group.add(mesh);
            }
          }

          '''
          s = s.replace(marker, addition + marker, 1)
          old = 'renderVolumes(); renderOpenings(); renderPlatforms();'
          new = 'renderVolumes(); renderOpenings(); renderChimneys(); renderPlatforms();'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Render NOUVEAU multiview
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current.json front .checkpoints/new-front.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current.json perspective .checkpoints/new-perspective.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current.json rear-oblique .checkpoints/new-rear-oblique.png --stepped-stairs
      - name: Verify only existing chimney geometry was consumed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.checkpoints/variants/current.json').read_text())
          assert len(d.get('chimneys', [])) == 1
          c=d['chimneys'][0]
          assert c['id']=='chimney-1'
          assert all(k in c for k in ('position','width','depth','height'))
          PY
      - name: Collect five references
        run: |
          cp 01-original.jpg .checkpoints/P1-original.jpg
          cp 02-original.jpg .checkpoints/P2-original.jpg
          cp 03-original.jpg .checkpoints/P3-original.jpg
          cp 04-original.jpg .checkpoints/P4-original.jpg
          cp 05-original.jpg .checkpoints/P5-original.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: chimney-recognition-gate
          path: |
            .checkpoints/current-*.png
            .checkpoints/new-*.png
            .checkpoints/P*-original.jpg
          if-no-files-found: error
          include-hidden-files: true
