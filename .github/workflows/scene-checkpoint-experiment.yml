name: Scene checkpoint experiment

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - 'scripts/render_scene_checkpoint.py'
      - 'scripts/render_brickmodel_checkpoint.py'
      - 'scripts/build_scene_brickmodel.py'
      - 'scripts/prepare_visual_sensitivity_sweep.py'
      - '.github/workflows/scene-checkpoint-experiment.yml'
      - 'frontend/scene-viewer*'
      - 'frontend/viewer*'
      - 'frontend/benchmarks/real-house-5/**'

permissions:
  contents: read

jobs:
  render-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Boldungo and browser adapter
        run: |
          python -m pip install -e .
          python -m pip install 'playwright>=1.50,<2'
      - name: Materialize CURRENT Scene
        run: python scripts/materialize_scene_recipe.py frontend/benchmarks/real-house-5/scene-candidate-v0.2.json .checkpoints/current.json
      - name: Prepare non-canonical sweep variants
        run: python scripts/prepare_visual_sensitivity_sweep.py .checkpoints/current.json .checkpoints/variants
      - name: Render CURRENT camera presets through real Scene viewer
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/current.json front .checkpoints/current-front.png
          python scripts/render_scene_checkpoint.py .checkpoints/current.json south-left .checkpoints/current-south-left.png
          python scripts/render_scene_checkpoint.py .checkpoints/current.json rear-oblique .checkpoints/current-rear-oblique.png
          python scripts/render_scene_checkpoint.py .checkpoints/current.json perspective .checkpoints/current-perspective.png --zoom-out 420
      - name: Render height sweep
        run: |
          for h in 6.5 6 5.6; do
            python scripts/render_scene_checkpoint.py .checkpoints/variants/height-$h.json front .checkpoints/height-$h-front.png
            python scripts/render_scene_checkpoint.py .checkpoints/variants/height-$h.json south-left .checkpoints/height-$h-south-left.png
          done
      - name: Render terrace sweep
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/variants/terrace-50.json south-left .checkpoints/terrace-50-south-left.png
          python scripts/render_scene_checkpoint.py .checkpoints/variants/terrace-62.json south-left .checkpoints/terrace-62-south-left.png
      - name: Render selected combined variant
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/variants/combined-6.5-62.json front .checkpoints/combined-front.png
          python scripts/render_scene_checkpoint.py .checkpoints/variants/combined-6.5-62.json south-left .checkpoints/combined-south-left.png
          python scripts/render_scene_checkpoint.py .checkpoints/variants/combined-6.5-62.json rear-oblique .checkpoints/combined-rear-oblique.png
          python scripts/render_scene_checkpoint.py .checkpoints/variants/combined-6.5-62.json perspective .checkpoints/combined-perspective.png --zoom-out 420
      - name: Build one full BrickModel for selected combined Scene
        run: python scripts/build_scene_brickmodel.py .checkpoints/variants/combined-6.5-62.json .checkpoints/combined-brickhouse-export.json
      - name: Render selected BrickModel through real viewer
        run: |
          python scripts/render_brickmodel_checkpoint.py .checkpoints/combined-brickhouse-export.json front .checkpoints/brickmodel-front.png
          python scripts/render_brickmodel_checkpoint.py .checkpoints/combined-brickhouse-export.json south-left .checkpoints/brickmodel-south-left.png
          python scripts/render_brickmodel_checkpoint.py .checkpoints/combined-brickhouse-export.json rear-oblique .checkpoints/brickmodel-rear-oblique.png
          python scripts/render_brickmodel_checkpoint.py .checkpoints/combined-brickhouse-export.json perspective .checkpoints/brickmodel-perspective.png
      - name: Verify PNG outputs
        run: |
          test -s .checkpoints/current-front.png
          test -s .checkpoints/current-south-left.png
          test -s .checkpoints/current-rear-oblique.png
          test -s .checkpoints/current-perspective.png
          test -s .checkpoints/height-6.5-front.png
          test -s .checkpoints/height-6-front.png
          test -s .checkpoints/height-5.6-front.png
          test -s .checkpoints/height-6.5-south-left.png
          test -s .checkpoints/height-6-south-left.png
          test -s .checkpoints/height-5.6-south-left.png
          test -s .checkpoints/terrace-50-south-left.png
          test -s .checkpoints/terrace-62-south-left.png
          test -s .checkpoints/combined-front.png
          test -s .checkpoints/combined-south-left.png
          test -s .checkpoints/combined-rear-oblique.png
          test -s .checkpoints/combined-perspective.png
          test -s .checkpoints/brickmodel-front.png
          test -s .checkpoints/brickmodel-south-left.png
          test -s .checkpoints/brickmodel-rear-oblique.png
          test -s .checkpoints/brickmodel-perspective.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-sensitivity-with-brickmodel
          path: |
            .checkpoints/*.png
            .checkpoints/combined-brickhouse-export.json
          if-no-files-found: error
          include-hidden-files: true
