name: Scene checkpoint experiment

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - 'scripts/render_scene_checkpoint.py'
      - 'scripts/prepare_visual_sensitivity_sweep.py'
      - 'scripts/prepare_south_terrace_guardrail_gate.py'
      - 'scripts/prepare_south_terrace_structure_gate.py'
      - 'scripts/prepare_front_lower_register_gate.py'
      - '.github/workflows/scene-checkpoint-experiment.yml'
      - 'frontend/scene-viewer*'
      - 'frontend/benchmarks/real-house-5/**'
      - 'backend/brickhouse/scene/benchmark_scene_recipe.py'

permissions:
  contents: read

jobs:
  render-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Boldungo and browser adapter
        run: |
          python -m pip install -e .
          python -m pip install 'playwright>=1.50,<2'
      - name: Rebuild current best experimental hypothesis
        run: |
          python scripts/materialize_scene_recipe.py frontend/benchmarks/real-house-5/scene-candidate-v0.2.json .checkpoints/current.json
          python scripts/prepare_visual_sensitivity_sweep.py .checkpoints/current.json .checkpoints/variants
          python scripts/prepare_south_terrace_guardrail_gate.py .checkpoints/variants/combined-6.5-62-terrace-footprint.json .checkpoints/variants/terrace-guardrail.json
          python scripts/prepare_south_terrace_structure_gate.py .checkpoints/variants/terrace-guardrail.json .checkpoints/variants/pre-front.json
          python scripts/prepare_front_lower_register_gate.py .checkpoints/variants/pre-front.json .checkpoints/variants/current-best.json
      - name: Render CURRENT
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current-best.json south-left .checkpoints/current-south-left.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/variants/current-best.json rear-oblique .checkpoints/current-rear-oblique.png --stepped-stairs
      - name: Apply one long-terrace silhouette hypothesis
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          src = Path('.checkpoints/variants/current-best.json')
          scene = json.loads(src.read_text())
          new = copy.deepcopy(scene)
          p = next(x for x in new['platforms'] if x['id'] == 'platform-timber-1')
          # One reversible perceptual hypothesis only: keep the acquired long rear termination
          # and full P3-visible projection, but extend the front edge to the front plane of the
          # main house. This does not assert hidden continuity behind the masonry/stair complex.
          old_rear = float(p['position']['y']) + float(p['depth'])
          p['position']['y'] = 0.0
          p['depth'] = old_rear
          p['source'] = {'kind': 'inferred', 'confidence': 0.10}
          p.setdefault('evidence', []).append({
            'photo_index': 3,
            'observation': 'EXPERIMENT ONLY: P3 reads the raised timber terrace as a long major South-facade element; front termination is not metrically measured. Extending its visible silhouette to the house front plane is a reversible sensitivity hypothesis, not hidden-junction truth.'
          })
          # Keep observed support coordinates exactly; do not synthesize supports.
          new['id'] = new.get('id','scene') + '-long-south-terrace-silhouette-experiment'
          new['notes'] = (new.get('notes','') + ' EXPERIMENT ONLY: long South-terrace silhouette sensitivity. Existing rear termination, level, projection, supports, masonry landing, L stair and covered void remain unchanged; hidden local continuity remains unresolved.').strip()
          Path('.checkpoints/new.json').write_text(json.dumps(new, indent=2)+'\n')
          PY
      - name: Targeted invariants
        run: |
          python - <<'PY'
          import json
          a=json.load(open('.checkpoints/variants/current-best.json'))
          b=json.load(open('.checkpoints/new.json'))
          pa={p['id']:p for p in a['platforms']}; pb={p['id']:p for p in b['platforms']}
          ta,tb=pa['platform-timber-1'],pb['platform-timber-1']
          ma,mb=pa['platform-massive-1'],pb['platform-massive-1']
          assert ta['position']['z']==tb['position']['z']
          assert ta['width']==tb['width']
          assert ta['supports']==tb['supports']
          assert ma==mb
          assert a['stairs']==b['stairs']
          assert a.get('partial_wall_segments')==b.get('partial_wall_segments')
          assert abs((ta['position']['y']+ta['depth'])-(tb['position']['y']+tb['depth']))<1e-9
          assert tb['position']['y']==0.0
          print('PASS: only timber longitudinal silhouette changed; levels/projection/supports/masonry/stair/covered-void representation unchanged')
          PY
      - name: Render NOUVEAU
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/new.json south-left .checkpoints/new-south-left.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/new.json rear-oblique .checkpoints/new-rear-oblique.png --stepped-stairs
      - name: Collect P3 P4 P5 references
        run: |
          cp 03-original.jpg .checkpoints/P3-original.jpg
          cp 04-original.jpg .checkpoints/P4-original.jpg
          cp 05-original.jpg .checkpoints/P5-original.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: south-global-identity-gate
          path: .checkpoints
          if-no-files-found: error
          include-hidden-files: true
