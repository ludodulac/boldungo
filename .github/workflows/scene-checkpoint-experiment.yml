name: Scene checkpoint experiment

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - 'scripts/render_scene_checkpoint.py'
      - 'scripts/prepare_visual_sensitivity_sweep.py'
      - 'scripts/prepare_south_terrace_guardrail_gate.py'
      - 'scripts/prepare_south_terrace_structure_gate.py'
      - '.github/workflows/scene-checkpoint-experiment.yml'
      - 'frontend/scene-viewer*'
      - 'frontend/benchmarks/real-house-5/**'

permissions:
  contents: read

jobs:
  render-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Boldungo and browser adapter
        run: |
          python -m pip install -e .
          python -m pip install 'playwright>=1.50,<2'
      - name: Materialize unchanged architectural Scene
        run: python scripts/materialize_scene_recipe.py frontend/benchmarks/real-house-5/scene-candidate-v0.2.json .checkpoints/current.json
      - name: Rebuild accepted experimental architectural hypothesis
        run: |
          python scripts/prepare_visual_sensitivity_sweep.py .checkpoints/current.json .checkpoints/variants
          python scripts/prepare_south_terrace_guardrail_gate.py .checkpoints/variants/combined-6.5-62-terrace-footprint.json .checkpoints/variants/terrace-guardrail.json
          python scripts/prepare_south_terrace_structure_gate.py .checkpoints/variants/terrace-guardrail.json .checkpoints/variants/terrain-gate-scene.json
      - name: Render CURRENT and qualitative terrain with identical architecture and cameras
        run: |
          python scripts/render_scene_checkpoint.py .checkpoints/variants/terrain-gate-scene.json south-left .checkpoints/terrain-current-south-left.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/variants/terrain-gate-scene.json south-left .checkpoints/terrain-new-south-left.png --stepped-stairs --qualitative-terrain
          python scripts/render_scene_checkpoint.py .checkpoints/variants/terrain-gate-scene.json rear-oblique .checkpoints/terrain-current-rear-oblique.png --stepped-stairs
          python scripts/render_scene_checkpoint.py .checkpoints/variants/terrain-gate-scene.json rear-oblique .checkpoints/terrain-new-rear-oblique.png --stepped-stairs --qualitative-terrain
      - name: Verify PNG outputs
        run: test -s .checkpoints/terrain-current-south-left.png && test -s .checkpoints/terrain-new-south-left.png && test -s .checkpoints/terrain-current-rear-oblique.png && test -s .checkpoints/terrain-new-rear-oblique.png
      - uses: actions/upload-artifact@v4
        with:
          name: qualitative-terrain-gate
          path: .checkpoints/terrain-*.png
          if-no-files-found: error
          include-hidden-files: true
