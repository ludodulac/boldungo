name: Scene checkpoint experiment

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - '.github/workflows/scene-checkpoint-experiment.yml'

permissions:
  contents: read

jobs:
  survey-horizontal-relations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Boldungo and pytest
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run targeted Survey relation tests
        run: python -m pytest -q tests/survey/test_relative_horizontal_relations.py
