name: Scene checkpoint experiment

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - 'scripts/render_scene_checkpoint.py'
      - 'scripts/prepare_visual_sensitivity_sweep.py'
      - 'scripts/prepare_south_terrace_guardrail_gate.py'
      - 'scripts/prepare_south_terrace_structure_gate.py'
      - 'scripts/prepare_front_lower_register_gate.py'
      - '.github/workflows/scene-checkpoint-experiment.yml'
      - 'frontend/scene-viewer*'
      - 'frontend/benchmarks/real-house-5/**'
      - 'backend/brickhouse/scene/benchmark_scene_recipe.py'

permissions:
  contents: read

jobs:
  render-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Boldungo and browser adapter
        run: |
          python -m pip install -e .
          python -m pip install 'playwright>=1.50,<2'
      - name: Materialize architectural Scene with acquired P1 opening visuals
        run: python scripts/materialize_scene_recipe.py frontend/benchmarks/real-house-5/scene-candidate-v0.2.json .checkpoints/current.json
      - name: Rebuild accepted experimental hypothesis without rejected terrain or upper-rhythm experiment
        run: |
          python scripts/prepare_visual_sensitivity_sweep.py .checkpoints/current.json .checkpoints/variants
          python scripts/prepare_south_terrace_guardrail_gate.py .checkpoints/variants/combined-6.5-62-terrace-footprint.json .checkpoints/variants/terrace-guardrail.json
          python scripts/prepare_south_terrace_structure_gate.py .checkpoints/variants/terrace-guardrail.json .checkpoints/variants/pre-front.json
          python scripts/prepare_front_lower_register_gate.py .checkpoints/variants/pre-front.json .checkpoints/variants/front-viewer-new.json
      - name: Render new viewer front with identical locked camera
        run: python scripts/render_scene_checkpoint.py .checkpoints/variants/front-viewer-new.json front .checkpoints/front-viewer-new.png --stepped-stairs
      - name: Verify PNG output
        run: test -s .checkpoints/front-viewer-new.png
      - name: Collect P1 reference
        run: cp 01-original.jpg .checkpoints/P1-original.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: p1-opening-viewer-gate
          path: |
            .checkpoints/front-viewer-new.png
            .checkpoints/P1-original.jpg
          if-no-files-found: error
          include-hidden-files: true
