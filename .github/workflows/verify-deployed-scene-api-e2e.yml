name: Verify deployed Scene API E2E

on:
  workflow_run:
    workflows: ["Deploy viewer to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-scene-api-e2e:
    name: Verify Scene validation and LEGO build
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser driver
        run: python -m pip install 'playwright>=1.50,<2'

      - name: Exercise public Scene validation, build, and capture canonical views
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGE_URL: https://ludodulac.github.io/boldungo/
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from urllib.parse import urljoin

          from playwright.sync_api import sync_playwright

          base = os.environ['PAGE_URL']
          deploy_sha = os.environ['DEPLOY_SHA']
          route = f'scene.html?benchmark=real-house-5&stage=scene&runtime-check={deploy_sha}'
          url = urljoin(base if base.endswith('/') else base + '/', route)
          out = Path('viewer-screenshots')
          out.mkdir(parents=True, exist_ok=True)
          browser_path = next((shutil.which(name) for name in (
              'google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser'
          ) if shutil.which(name)), None)
          if not browser_path:
              raise AssertionError('No Chromium/Chrome binary is available on the Scene API E2E runner')

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  executable_path=browser_path,
                  args=['--no-sandbox'],
              )
              page = browser.new_page(viewport={'width': 1440, 'height': 1000}, device_scale_factor=1)
              page.set_default_timeout(120000)
              runtime_errors = []
              page.on('pageerror', lambda error: runtime_errors.append(f'pageerror: {error}'))

              response = page.goto(url, wait_until='domcontentloaded', timeout=30000)
              assert response and response.ok, (
                  f'scene.html HTTP failure: {response.status if response else "no response"}'
              )

              page.wait_for_function(
                  """() => document.querySelector('#scene-result-json')?.dataset.sceneApiE2e === 'bh156'""",
                  timeout=30000,
              )
              scene = json.loads(page.locator('#scene-result-json').input_value())
              assert scene['id'] == 'brickhouse-scene-real-house-5-candidate'

              page.locator('#scene-import-result').click()
              page.wait_for_function(
                  """() => {
                    const button = document.querySelector('#scene-build-bricks');
                    const status = document.querySelector('#scene-result-status')?.textContent || '';
                    if (status.includes('Import impossible') || status.includes('Validation interrompue')) {
                      throw new Error(status);
                    }
                    return button && !button.disabled;
                  }""",
                  timeout=120000,
              )

              validation_status = page.locator('#scene-result-status').text_content().strip()
              assert 'Import impossible' not in validation_status, validation_status
              assert 'Validation interrompue' not in validation_status, validation_status
              assert page.locator('#scene-build-bricks').is_enabled()

              page.locator('#scene-build-bricks').click()
              try:
                  page.wait_for_url('**/viewer.html*', timeout=180000)
              except Exception as exc:
                  build_status = page.locator('#scene-result-status').text_content().strip()
                  raise AssertionError(f'Build did not reach viewer.html: {build_status}') from exc

              page.wait_for_function(
                  """() => {
                    const values = [...document.querySelectorAll('#model-summary dd')].map(node => node.textContent.trim());
                    return values.length >= 4 && values[0] !== '—' && values[1] !== '—';
                  }""",
                  timeout=30000,
              )
              canvas = page.locator('#viewer')
              canvas.wait_for(state='visible', timeout=10000)
              assert page.locator('#assembly-card').is_visible(), 'viewer has no visible assembly plan'
              assert page.locator('#assembly-title').text_content().strip() == 'Modèle complet'
              canvas_box = canvas.bounding_box()
              assert canvas_box, 'viewer canvas has no layout box'
              assert canvas_box['height'] <= 1005, canvas_box

              export_raw = page.evaluate("localStorage.getItem('brickhouse.currentExport')")
              assert export_raw, 'viewer rendered without brickhouse.currentExport'
              export = json.loads(export_raw)
              parts = export.get('brick_model', {}).get('parts') or []
              steps = export.get('assembly_plan', {}).get('steps') or []
              total_parts = export.get('bom', {}).get('total_parts')
              assert parts, 'deployed build returned no LEGO parts'
              assert total_parts == len(parts), (total_parts, len(parts))
              assert steps, 'deployed build returned no assembly steps'
              assert page.locator('#message').text_content().strip() == 'Votre maquette BrickHouse est prête.'

              page.wait_for_timeout(1500)
              views = [
                  ('perspective', '#reset-view'),
                  ('front', '#view-front'),
                  ('rear', '#view-rear'),
                  ('left', '#view-left'),
                  ('right', '#view-right'),
              ]
              for name, selector in views:
                  assert page.locator('#assembly-title').text_content().strip() == 'Modèle complet'
                  page.locator(selector).click()
                  page.wait_for_timeout(800)
                  canvas.screenshot(path=str(out / f'{name}.png'))

              summary = {
                  'deploy_sha': deploy_sha,
                  'scene_id': scene['id'],
                  'building_id': export.get('building_id'),
                  'parts': len(parts),
                  'assembly_steps': len(steps),
                  'viewer_canvas_height': canvas_box['height'],
                  'source_url': url,
              }
              (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
              assert not runtime_errors, runtime_errors
              browser.close()

          print(
              'deployed Scene API E2E passed: '
              f'{url} -> viewer.html with {len(parts)} parts and {len(steps)} assembly steps; '
              'captured perspective/front/rear/left/right from Modèle complet'
          )
          PY

      - name: Upload deployed viewer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: real-house-5-viewer-${{ github.event.workflow_run.head_sha }}
          path: viewer-screenshots/
          if-no-files-found: error
          retention-days: 14
