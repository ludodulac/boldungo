name: Opening contract unification check

on:
  push:
    branches: [experiment/real-house-5-visual-sensitivity]
    paths:
      - 'backend/brickhouse/building/__init__.py'
      - 'backend/brickhouse/survey/models.py'
      - 'tests/survey/test_opening_visual_contract_unification.py'
      - '.github/workflows/opening-contract-unification-check.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run contract unification tests
        run: pytest -q tests/survey/test_opening_visual_contract_unification.py
      - name: Run survey regression tests
        run: pytest -q tests/survey
