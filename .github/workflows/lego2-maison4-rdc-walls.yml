name: LEGO2 MAISON-4 remaining canonical RDC walls
on:
  pull_request:
    branches: [feat/lego2-maison3-guided004-full-east-rdc]
    paths:
      - 'scripts/build_guided004_maison4.py'
      - 'tests/bricks/test_guided004_maison4.py'
      - '.github/workflows/lego2-maison4-rdc-walls.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maison4-one-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  maison4-one-build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing dependencies, no new engines
        run: |
          python -m pip install -e .
          python -m pip install -e ./lego_geometry_engine
          python -m pip install pytest
      - name: Syntax check BEFORE run
        run: python -m py_compile scripts/build_guided004_maison4.py
      - name: Existing approved LDraw part catalog
        run: python scripts/download_ldraw_probe_066.py /tmp/maison4-ldraw --max-files 250 --parts 3811 3003 3006 3832 3022 3005 3004 3008 3009 3010 3622 3710 3460 3623
      - name: ONE construction, then only NEW interfaces
        run: python scripts/build_guided004_maison4.py --ldraw-root /tmp/maison4-ldraw --output artifacts/lego2-maison4
      - name: ONE targeted campaign only
        run: python -m pytest -q tests/bricks/test_guided004_maison4.py
      - name: Archive even partial files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOLDUNGO-MAISON4-NOT-CERTIFIED
          path: artifacts/lego2-maison4/MAISON4-*
          retention-days: 30
          if-no-files-found: warn
      - name: Direct GitHub publication - fetch remote HEAD and FAST-FORWARD only
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ ! -s artifacts/lego2-maison4/MAISON4-MURS-RDC-COMPLETS.ldr ]; then
            echo 'No real LDraw; refusing synthetic publication.'
            exit 1
          fi
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git switch -C "${BRANCH}" "refs/remotes/origin/${BRANCH}"
          mkdir -p missions/MAISON4/generated
          cp artifacts/lego2-maison4/MAISON4-* missions/MAISON4/generated/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missions/MAISON4/generated/
          if ! git diff --cached --quiet; then
            git commit -m 'MAISON-4: persist canonical RDC walls and new-interface evidence'
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
