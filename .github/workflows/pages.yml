name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/examples/**'
      - 'tests/fixtures/brickhouse_scene_current.json'
      - 'tests/fixtures/real_house_5_shutter_observations.json'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/verify-deployed-scene.yml'
      - '.github/workflows/verify-deployed-scene-api-e2e.yml'
      - '.github/workflows/verify-deployed-photo-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install BrickHouse
        run: python -m pip install -e .

      - name: Generate real reference export
        run: >-
          brickhouse-m0
          docs/examples/building-model-simple-house.json
          frontend/sample-export.json
          --front-width-studs 48

      - name: Publish current BrickHouse architectural reference
        run: cp tests/fixtures/brickhouse_scene_current.json frontend/brickhouse-scene-current.json

      - name: Generate current five-photo first-bricks export
        run: >-
          brickhouse-scene-build
          tests/fixtures/brickhouse_scene_current.json
          frontend/brickhouse-partial-export.json
          --front-width-studs 48
          --allow-partial
          --optimize-scale
          --opening-visual-evidence tests/fixtures/real_house_5_shutter_observations.json

      - name: Verify first-bricks export
        run: |
          test -s frontend/brickhouse-partial-export.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('frontend/brickhouse-partial-export.json').read_text())
          parts = data['brick_model']['parts']
          assert parts
          assert any(part['component'] == 'wall' for part in parts)
          assert not any(part['component'] == 'roof' for part in parts)
          assert data['bom']['total_parts'] == len(parts)
          assert data['assembly_plan']['total_parts'] == len(parts)
          assert data['assembly_plan']['total_steps'] > 0
          assert any(issue['code'] == 'partial_preview_roof_omitted' for issue in data['fidelity_issues'])
          shutter_openings = {
              part['opening_id']
              for part in parts
              if part.get('placement_id', '').startswith('scene-shutter:')
          }
          assert shutter_openings == {
              'front_window_upper_left',
              'front_window_upper_right',
              'front_window_middle_right',
              'right_window_upper',
          }
          assert 'front_window_middle_left' not in shutter_openings
          metadata = data['metadata']
          assert metadata['discretization_quality']
          recommendation = metadata['scale_recommendation']
          assert recommendation['preferred_front_width_studs'] == 48
          selected_width = data['brick_model']['width_studs']
          if recommendation['improvement_fraction'] >= 0.10:
              assert selected_width in {48, recommendation['recommended_front_width_studs']}
          else:
              assert selected_width == 48
          PY

      - name: Generate canonical real-house-5 visual checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from brickhouse.partial_scene_pipeline import run_partial_scene_pipeline
          from brickhouse.scene.benchmark_scene_recipe import materialize_scene_recipe

          recipe = Path('frontend/benchmarks/real-house-5/scene-candidate-v0.2.json')
          scene = materialize_scene_recipe(recipe)
          bundle = run_partial_scene_pipeline(scene, front_width_studs=48)

          output = Path('frontend/real-house-5-visual-checkpoint.json')
          output.write_text(
              json.dumps(bundle.model_dump(mode='json'), indent=2),
              encoding='utf-8',
          )

          parts = bundle.brick_model.parts
          ids = [part.placement_id for part in parts]
          assert parts
          assert bundle.bom.total_parts == len(parts)
          assert bundle.assembly_plan is not None and bundle.assembly_plan.steps
          assert any(value.startswith('scene-platform:platform-timber-1:') for value in ids)
          assert any('stair-exterior-1-run-lower-v1' in value for value in ids)
          assert any('stair-exterior-1-run-upper-v1' in value for value in ids)
          PY

      - name: Verify canonical real-house-5 visual checkpoint
        run: |
          test -s frontend/real-house-5-visual-checkpoint.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('frontend/real-house-5-visual-checkpoint.json').read_text())
          parts = data['brick_model']['parts']
          assert data['bom']['total_parts'] == len(parts)
          assert data['assembly_plan']['total_steps'] == len(data['assembly_plan']['steps'])
          assert data['assembly_plan']['total_steps'] > 0
          PY

      - name: Generate generic rich Scene viewer export
        run: >-
          brickhouse-scene-build
          docs/examples/architectural-scene-rich-exterior.json
          frontend/brickhouse-rich-scene-export.json
          --front-width-studs 48

      - name: Verify generic rich Scene viewer export
        run: |
          test -s frontend/brickhouse-rich-scene-export.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('frontend/brickhouse-rich-scene-export.json').read_text())
          parts = data['brick_model']['parts']
          ids = [part['placement_id'] for part in parts]
          assert any(value.startswith('scene-platform:deck:') for value in ids)
          assert any(value.startswith('scene-stair:deck_stair:') for value in ids)
          assert any(value.startswith('scene-terrain:right:') for value in ids)
          assert data['bom']['total_parts'] == len(parts)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-deployed-photo:
    name: Verify deployed photo interactions
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser driver
        run: python -m pip install 'playwright>=1.50,<2'

      - name: Click deployed photo controls
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          base = os.environ['PAGE_URL']
          sha = os.environ['DEPLOY_SHA']
          url = urljoin(base if base.endswith('/') else base + '/', f'photo.html?runtime-check={sha}')
          browser_path = next((shutil.which(name) for name in (
              'google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser'
          ) if shutil.which(name)), None)
          if not browser_path:
              raise AssertionError('No Chromium/Chrome binary is available on the Pages verification runner')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path=browser_path, args=['--no-sandbox'])
              page = browser.new_page(viewport={'width': 390, 'height': 844})
              runtime_errors = []
              page.on('pageerror', lambda error: runtime_errors.append(f'pageerror: {error}'))
              response = page.goto(url, wait_until='domcontentloaded', timeout=30000)
              assert response and response.ok, f'photo.html HTTP failure: {response.status if response else "no response"}'
              page.locator('.boldungo-cockpit').wait_for(state='visible', timeout=10000)
              page.locator('#boldungo-site-nav').wait_for(state='attached', timeout=10000)

              cockpit = page.locator('.boldungo-cockpit')
              survey = page.locator('[data-shell-state="survey"]')
              photos = page.locator('[data-shell-state="photos"]')
              toggle = page.locator('.site-nav-toggle')

              assert cockpit.get_attribute('data-shell-state') == 'photos'
              survey.click(timeout=5000)
              assert cockpit.get_attribute('data-shell-state') == 'survey'
              photos.click(timeout=5000)
              assert cockpit.get_attribute('data-shell-state') == 'photos'

              toggle.click(timeout=5000)
              assert toggle.get_attribute('aria-expanded') == 'true'
              assert page.locator('#site-menu-panel').is_visible()
              toggle.click(timeout=5000)
              assert toggle.get_attribute('aria-expanded') == 'false'

              survey.click(timeout=5000)
              assert cockpit.get_attribute('data-shell-state') == 'survey'
              assert page.locator('#download-ai-package').text_content().strip() == 'Créer le PDF Photos → Relevé'
              assert not runtime_errors, runtime_errors
              browser.close()

          print(f'deployed interaction verification passed: {url}')
          PY

  verify-deployed-visual-checkpoint:
    name: Verify deployed visual checkpoint on mobile
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser verification dependencies
        run: python -m pip install 'playwright>=1.50,<2' 'pillow>=11,<12'

      - name: Verify mobile viewer and construction checkpoint
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import shutil
          from urllib.parse import urljoin
          from urllib.request import urlopen

          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright

          base = os.environ['PAGE_URL']
          sha = os.environ['DEPLOY_SHA']
          root = base if base.endswith('/') else base + '/'
          bundle_name = 'real-house-5-visual-checkpoint.json'
          bundle_url = urljoin(root, bundle_name)
          viewer_url = urljoin(root, f'viewer.html?bundle={bundle_name}&runtime-check={sha}')
          construction_url = urljoin(
              root,
              f'viewer.html?bundle={bundle_name}&mode=construction&runtime-check={sha}',
          )

          with urlopen(bundle_url, timeout=30) as response:
              assert response.status == 200, response.status
              bundle = json.load(response)
          total_parts = bundle['bom']['total_parts']
          total_steps = bundle['assembly_plan']['total_steps']
          assert total_parts == len(bundle['brick_model']['parts'])
          assert total_steps == len(bundle['assembly_plan']['steps'])
          assert total_parts > 0
          assert total_steps > 0

          browser_path = next((shutil.which(name) for name in (
              'google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser'
          ) if shutil.which(name)), None)
          if not browser_path:
              raise AssertionError('No Chromium/Chrome binary is available on the Pages verification runner')

          def wait_loaded(page):
              page.locator('#message').wait_for(state='attached', timeout=10000)
              page.wait_for_function(
                  "() => document.querySelector('#message')?.textContent?.includes('Export BOLDÜNGO chargé.')",
                  timeout=30000,
              )
              page.locator('#viewer').wait_for(state='visible', timeout=10000)
              page.wait_for_timeout(700)

          def canvas_bytes(page):
              page.wait_for_timeout(350)
              return page.locator('#viewer').screenshot()

          def canvas_hash(page):
              return hashlib.sha256(canvas_bytes(page)).hexdigest()

          def assert_model_visible(png):
              image = Image.open(io.BytesIO(png)).convert('RGB')
              width, height = image.size
              crop = image.crop((
                  int(width * 0.20),
                  int(height * 0.15),
                  int(width * 0.80),
                  int(height * 0.85),
              ))
              variance = ImageStat.Stat(crop).var
              assert max(variance) > 45, f'central canvas has too little visual content: {variance}'

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  executable_path=browser_path,
                  args=['--no-sandbox'],
              )
              page = browser.new_page(viewport={'width': 390, 'height': 844})
              runtime_errors = []
              page.on('pageerror', lambda error: runtime_errors.append(f'pageerror: {error}'))

              response = page.goto(viewer_url, wait_until='domcontentloaded', timeout=30000)
              assert response and response.ok, (
                  f'viewer HTTP failure: {response.status if response else "no response"}'
              )
              wait_loaded(page)

              summary = page.locator('#model-summary dd').all_text_contents()
              assert len(summary) >= 2
              assert summary[1].strip() == str(total_parts), (summary, total_parts)

              view_hashes = {}
              for name, selector in (
                  ('PERSPECTIVE', '#reset-view'),
                  ('FRONT', '#view-front'),
                  ('RIGHT', '#view-right'),
                  ('LEFT', '#view-left'),
                  ('REAR', '#view-rear'),
              ):
                  page.locator(selector).click(timeout=5000)
                  shot = canvas_bytes(page)
                  assert_model_visible(shot)
                  view_hashes[name] = hashlib.sha256(shot).hexdigest()
              assert len(set(view_hashes.values())) == 5, view_hashes

              page.locator('#reset-view').click(timeout=5000)
              before_orbit = canvas_hash(page)
              canvas = page.locator('#viewer')
              box = canvas.bounding_box()
              assert box and box['width'] > 100 and box['height'] > 100, box
              start_x = box['x'] + box['width'] * 0.56
              start_y = box['y'] + box['height'] * 0.48
              page.mouse.move(start_x, start_y)
              page.mouse.down()
              page.mouse.move(start_x + 72, start_y + 28, steps=12)
              page.mouse.up()
              after_orbit = canvas_hash(page)
              assert after_orbit != before_orbit, 'OrbitControls drag did not change the rendered view'

              response = page.goto(construction_url, wait_until='domcontentloaded', timeout=30000)
              assert response and response.ok, (
                  f'construction viewer HTTP failure: {response.status if response else "no response"}'
              )
              wait_loaded(page)
              hud = page.locator('#construction-hud')
              hud.wait_for(state='visible', timeout=10000)
              counter = page.locator('#construction-counter')
              assert counter.text_content().strip() == f'Étape 1 / {total_steps}'

              step1 = canvas_hash(page)
              page.locator('#construction-next').click(timeout=5000)
              page.wait_for_timeout(450)
              assert counter.text_content().strip() == f'Étape 2 / {total_steps}'
              step2 = canvas_hash(page)
              assert step2 != step1, 'Construction step 2 did not change visible parts'

              page.locator('#construction-prev').click(timeout=5000)
              page.wait_for_timeout(450)
              assert counter.text_content().strip() == f'Étape 1 / {total_steps}'
              assert not runtime_errors, runtime_errors
              browser.close()

          print(json.dumps({
              'viewer_url': viewer_url,
              'construction_url': construction_url,
              'total_parts': total_parts,
              'assembly_steps': total_steps,
              'views': view_hashes,
              'mobile_visual_check': 'PASS',
          }, ensure_ascii=False))
          PY

# Pages source is GitHub Actions; post-deploy interaction verification guards the public runtime.
