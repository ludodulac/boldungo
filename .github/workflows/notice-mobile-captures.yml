name: NOTICE mobile checkpoint captures ###
on:
  push:
    branches: [feature/notice-reconstructed-steps-1-34]
    paths: ['.github/workflows/notice-mobile-captures.yml']
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Serve frontend and capture NOTICE viewport
        run: |
          python -m http.server 4173 --directory frontend >/tmp/http.log 2>&1 &
          cat > capture.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const n of ['0001','0012','0024','0034']){
            const context=await browser.newContext({...devices['Pixel 5']});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/viewer.html?notice=step-'+n,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__NOTICE_PROOF__?.current_step);
            await page.locator('.viewer-wrap').screenshot({path:'notice-step-'+n+'-mobile.png'});
            await context.close();
          }
          await browser.close();
          JS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: notice-1-34-mobile-checkpoints
          path: notice-step-*-mobile.png
          retention-days: 14
