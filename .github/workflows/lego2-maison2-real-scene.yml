name: LEGO2 MAISON-2 one real east facade bay
on:
  pull_request:
    branches: [feat/lego2-maison1-guided004-southeast-corner]
    paths:
      - scripts/build_guided004_corner_maison2.py
      - tests/bricks/test_guided004_corner_maison2.py
      - .github/workflows/lego2-maison2-real-scene.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  single-build:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing tools
        run: |
          python -m pip install -e .
          python -m pip install -e ./lego_geometry_engine
          python -m pip install pytest
      - name: One test campaign
        run: python -m pytest -q tests/bricks/test_guided004_corner_maison2.py
      - name: Fetch known genuine LDraw parts
        run: python scripts/download_ldraw_probe_066.py /tmp/maison2-ldraw --max-files 250 --parts 3811 3003 3006 3832 3022 3005 3004 3008 3009 3010 3622 3710
      - name: Build real LDraw and schematic first, then connections
        run: python scripts/build_guided004_corner_maison2.py --ldraw-root /tmp/maison2-ldraw --output artifacts/lego2-maison2
      - name: Verify tangible output against old 126 placements
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('artifacts/lego2-maison2')
          r=json.loads((p/'MAISON2-RESULTATS.json').read_text())
          b=json.loads((p/'MAISON2-NOMENCLATURE.json').read_text())
          origin=json.loads((p/'MAISON2-PROVENANCE.json').read_text())
          lines=lambda s:[l for l in s.splitlines() if l.startswith('1 ')]
          m2=lines((p/'MAISON2-FRAGMENT-AGRANDI.ldr').read_text())
          m1=lines(Path('missions/MAISON1/generated/MAISON1-EST-SUD-FRAGMENT.ldr').read_text())
          assert len(m1)==126 and m2[:126]==m1
          assert r['parts_total']==len(m2)>126
          assert origin['canonical_model_count']==1890
          assert origin['source_dimensions_m']=={'east':9.3,'south':8.2}
          assert r['new_collisions']==0
          assert sum(b['by_real_LDraw_part'].values())==len(m2)
          assert (p/'MAISON2-VUE-3D-SCHEMATIQUE.svg').exists()
          print('MAISON2_SOURCE_BAY_PRESERVED_126_PASS',r)
          PY
      - name: Save artifacts even on partial result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOLDUNGO-MAISON2-NOT-CERTIFIED
          path: artifacts/lego2-maison2/MAISON2-*
          retention-days: 30
          if-no-files-found: warn
      - name: Save final generated files only in MAISON-2 draft branch
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          NEW_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p missions/MAISON2/generated
          cp artifacts/lego2-maison2/MAISON2-* missions/MAISON2/generated/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missions/MAISON2/generated/
          if ! git diff --cached --quiet; then
            git commit -m 'MAISON-2 generated one real east facade bay LDraw and proof'
            git push origin "HEAD:refs/heads/${NEW_BRANCH}"
          fi
