name: Experiment 026 targeted tests
on:
  pull_request:
    branches: [experiment/bootstrap-invariants-023]
jobs:
  targeted-tests:
    if: github.head_ref == 'experiment/inquiry-property-registry-026'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run Experiment 008-026 targeted tests
        run: pytest -q tests/vision/test_multiview_workspace.py tests/survey/test_multiview_workspace_bridge.py tests/survey/test_reasoning_state.py
