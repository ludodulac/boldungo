name: LEGO2 GUIDED-004 actual export

on:
  push:
    branches:
      - feat/lego2-existing-house-021
  workflow_dispatch:

jobs:
  export-real-house:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing BrickHouse engine
        run: python -m pip install -e ".[dev]"
      - name: Execute actual GUIDED-004 conversion and inventory
        run: python scripts/export_guided004_lego.py
      - name: Validate generated viewer bundle and exact counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/lego2-guided-004')
          model=json.loads((root/'brick-model.json').read_text())
          viewer=json.loads((root/'viewer-export.json').read_text())
          inventory=json.loads((root/'inventory.json').read_text())
          assert len(model['parts'])==inventory['total_bricks']>0
          assert viewer['brick_model']==model
          assert viewer['bom']['total_parts']==len(model['parts'])
          assert sum(inventory['references'].values())==len(model['parts'])
          print('GUIDED004_EXPORT_CHECK=PASS')
          print('GUIDED004_TOTAL_BRICKS=',len(model['parts']))
          print('GUIDED004_PART_REFERENCES=',inventory['references'])
          PY
      - name: Verify LEGO2-057 A/B/C against actual GUIDED-004 export
        run: python scripts/experiment_terrace_057.py artifacts/lego2-guided-004/brick-model.json
      - name: Audit LEGO2-058B real support paths before and after connector evidence
        run: python scripts/audit_support_058b.py artifacts/lego2-guided-004/brick-model.json
      - name: Search LEGO2-059 physical terrace reinforcement on authentic GUIDED-004
        run: python scripts/prototype_terrace_059.py artifacts/lego2-guided-004/brick-model.json
      - name: Verify LEGO2-059B fixed T1 and T1+T2 variants
        run: python scripts/prototype_terrace_059b.py artifacts/lego2-guided-004/brick-model.json
      - name: Verify LEGO2-059B assembly sweeps and produce experimental LDraw
        run: python scripts/assembly_terrace_059b.py artifacts/lego2-guided-004/brick-model.json
      - name: Upload actual conversion artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego2-guided004-real-house-export
          path: |
            artifacts/lego2-guided-004/
            artifacts/lego2-059/
            artifacts/lego2-059b/
          if-no-files-found: warn
          retention-days: 30
