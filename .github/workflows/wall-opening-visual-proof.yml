name: Wall opening visual proof

on:
  pull_request:
    paths:
      - 'backend/brickhouse/bricks/spatial.py'
      - 'tests/bricks/test_detailed_wall_opening_prototype.py'
      - '.github/workflows/wall-opening-visual-proof.yml'

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and browser helper
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install 'playwright>=1.50,<2'
      - name: Generate matched BEFORE and AFTER exports
        run: python tests/visual_wall_opening_proof.py generate
      - name: Capture matched viewer images
        run: python tests/visual_wall_opening_proof.py capture
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: wall-opening-before-after
          path: |
            /tmp/wall-opening-proof/before.png
            /tmp/wall-opening-proof/after.png
            /tmp/wall-opening-proof/parts.txt
          if-no-files-found: error
          retention-days: 14
