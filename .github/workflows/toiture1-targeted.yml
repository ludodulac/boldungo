name: TOITURE-1 — one original slope/support geometric insertion
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/toiture1_probe.py'
      - 'scripts/toiture1_browser.py'
      - 'missions/TOITURE1/MODULE-B3-ORIGINAL.ldr'
      - 'missions/TOITURE1/VIEWER-3.json'
      - '.github/workflows/toiture1-targeted.yml'
permissions:
  contents: write
concurrency:
  group: toiture1-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  proof-and-viewer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing engine and browser
        run: |
          python -m pip install -e "./lego_geometry_engine"
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pinned genuine LEGO 30363 and 3622 LDraw geometry, subparts, primitives
        run: python scripts/download_ldraw_probe_066.py /tmp/toiture1-ldraw --max-files 160 --parts 30363 3622
      - name: ONE B-3 ORIGINAL slope-to-chimney-support full continuous proof
        run: python scripts/toiture1_probe.py --ldraw-root /tmp/toiture1-ldraw
      - name: ONE existing mobile viewer, three-step sequence
        run: python scripts/toiture1_browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOITURE1-ORIGINAL-30363-EVIDENCE
          path: |
            missions/TOITURE1/*.json
            missions/TOITURE1/*.ldr
            missions/TOITURE1/*.png
          retention-days: 30
          if-no-files-found: warn
      - name: Persist factual proof reports in DRAFT branch, never main
        if: success()
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missions/TOITURE1/CONNEXIONS.json missions/TOITURE1/COLLISIONS.json missions/TOITURE1/INSERTION.json missions/TOITURE1/RESULTAT.json missions/TOITURE1/roof-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "TOITURE-1: measured original B-3 roof/support evidence and mobile image"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
