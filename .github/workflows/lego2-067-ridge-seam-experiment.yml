name: LEGO2-067 real LDraw apex spacing experiment

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/ridge_seam_offsets_067.py'
      - 'scripts/probe_ridge_seam_067.py'
      - 'scripts/download_ldraw_probe_066.py'
      - 'tests/bricks/test_ridge_seam_offsets_067.py'
      - '.github/workflows/lego2-067-ridge-seam-experiment.yml'
  workflow_dispatch:

jobs:
  ridge-seam-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BrickHouse and geometry engines
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Rebuild official unchanged 1890-part model
        run: python scripts/export_guided004_lego.py > /tmp/ridge067-real-export.log
      - name: Fetch pinned LDraw geometry subset (including 2x2 ridge)
        run: python scripts/download_ldraw_probe_066.py /tmp/ldraw-067 --max-files 180
      - name: Diagnose five local spacings using real LDraw triangles
        run: |
          python scripts/probe_ridge_seam_067.py artifacts/lego2-guided-004/brick-model.json \
            --ldraw-root /tmp/ldraw-067 --max-offset 4 \
            --output artifacts/lego2-067/ridge-seam-experiment.json
      - name: Require measured 3D evidence not a guessed clearance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          model = json.loads(Path('artifacts/lego2-guided-004/brick-model.json').read_text())
          r = json.loads(Path('artifacts/lego2-067/ridge-seam-experiment.json').read_text())
          assert len(model['parts']) == 1890
          assert r['status'] == 'LOCAL_EXPERIMENT_ONLY'
          assert r['base_pair'] == ['roof-000185', 'roof-000392']
          assert len(r['offsets']) == 5
          assert r['physical_certification'] == 'NOT_CERTIFIED'
          assert r['model_mutated'] is False
          for row in r['offsets']:
            assert row['slopes_mesh'].get('mesh_relation') in ('SEPARATED','CONTACT','COLLISION'), row
            for test in row['tile_to_slopes'] + row['previous_positive_course']:
              assert test.get('mesh_relation') in ('SEPARATED','CONTACT','COLLISION'), test
          assert r['offsets'][0]['slopes_mesh']['mesh_relation'] == 'COLLISION'
          print('RIDGE_067_REAL_LDRAW_SPACING=PASS')
          print('RIDGE_067_SEAM_RELATIONS=', [(v['positive_roof_shift_studs'], v['slopes_mesh']['mesh_relation']) for v in r['offsets']])
          PY
      - name: Upload reversible experiment even if incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego2-067-roof-seam-real-ldraw
          path: artifacts/lego2-067/ridge-seam-experiment.json
          if-no-files-found: warn
          retention-days: 21
