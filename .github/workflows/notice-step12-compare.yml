name: NOTICE step 12 visual comparison
on:
  push:
    branches: [experiment/notice-step12-visual-action]
    paths: ['.github/workflows/notice-step12-compare.yml']
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Capture same mobile viewport before and after
        run: |
          python -m http.server 4173 --directory frontend >/tmp/http.log 2>&1 &
          cat > capture.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const [name,url] of [
            ['before','http://127.0.0.1:4173/viewer.html?notice=step-0012'],
            ['after','http://127.0.0.1:4173/viewer.html?notice=step-0012&visual=action']]){
            const context=await browser.newContext({...devices['Pixel 5']});
            const page=await context.newPage();
            await page.goto(url,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__NOTICE_PROOF__?.current_step==='step-0012');
            await page.locator('.viewer-wrap').screenshot({path:'step12-'+name+'.png'});
            await context.close();
          }
          await browser.close();
          JS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: notice-step12-before-after
          path: step12-*.png
          retention-days: 14
