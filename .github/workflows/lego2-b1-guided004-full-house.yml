name: LEGO2 B-1 GUIDED-004 complete 1901-piece experimental house
on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - "scripts/build_guided004_full_house_b1.py"
      - "tests/bricks/test_guided004_full_house_b1.py"
      - "missions/B1/**"
      - ".github/workflows/lego2-b1-guided004-full-house.yml"
  workflow_dispatch:

jobs:
  build-complete-experimental-house:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install already-existing BrickHouse code and geometry engine
        run: |
          python -m pip install -e .
          python -m pip install -e ./lego_geometry_engine
          python -m pip install pytest
      - name: Fast targeted guards — source nonmutation and 22degree official part family
        run: python -m pytest -q tests/bricks/test_guided004_full_house_b1.py
      - name: Obtain narrow pinned official LDraw mesh closure for slope 30363
        run: |
          python scripts/download_ldraw_probe_066.py /tmp/lego2-b1-real-30363 --max-files 150 --parts 30363
      - name: Generate complete experimental GUIDED-004, LDraw, whole-house preview and inventory
        run: |
          python scripts/build_guided004_full_house_b1.py --ldraw-root /tmp/lego2-b1-real-30363 --output artifacts/lego2-b1-guided004
      - name: Fail closed on fabricated whole-house metadata or missing real LDraw pieces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("artifacts/lego2-b1-guided004/EXPERIMENTAL-1901-FULL-HOUSE")
          cmp=json.loads((base/"COMPARISON-WITH-1890-CANONICAL.json").read_text())
          audit=json.loads((base/"CONNECTIONS-AND-COLLISIONS.json").read_text())
          bom=json.loads((base/"BOM.json").read_text())
          model=(base/"GUIDED004-B1-FULL-HOUSE-22DEG.ldr").read_text()
          assert cmp["canonical_count"]==1890
          assert cmp["experimental_count"]==1901
          assert cmp["same_nonridge_parts"] and cmp["net_delta"]==11
          assert cmp["slope_30363_original"]==cmp["slope_30363_experiment"]==408
          assert cmp["ldraw"]["complete_file"], cmp["ldraw"]["unmapped"][:8]
          assert cmp["ldraw"]["ldraw_type1_count"]==1901
          assert sum(line.startswith("1 ") for line in model.splitlines())==1901
          assert sum(bom["by_ldraw_id"].values())==1901
          assert audit["full_1901_connected_components_physical"]=="NOT_ESTABLISHED"
          assert audit["parts_without_fully_demonstrated_support_chain"]==1901
          assert cmp["source_scene_file_unchanged"] and cmp["original_export_unchanged"]
          assert (base/"GUIDED004-B1-FULL-HOUSE-ISOMETRIC.svg").stat().st_size>20000
          print("B1_FULL_1901_REAL_LDRAW_PARTS_PASS")
          print("B1_ALL_NON_RIDGE_ARCHITECTURE_IDENTICAL_PASS")
          print("B1_408_SLOPE_PARTS_PRESERVED_NO_45DEG_PASS")
          print("B1_1890_SOURCE_ISOLATED_AND_HASHED_PASS")
          PY
      - name: Save complete house files / BOM / plan / visible SVG / audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOLDUNGO-B1-GUIDED004-1901-FULL-HOUSE-EXPERIMENTAL-NOT-CERTIFIED
          path: artifacts/lego2-b1-guided004/
          retention-days: 30
          if-no-files-found: warn
