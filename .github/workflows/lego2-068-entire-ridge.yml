name: LEGO2-068 all ridge sites real LDraw

on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - 'backend/brickhouse/bricks/ridge_full_length_audit_068.py'
      - 'scripts/probe_full_ridge_068.py'
      - 'tests/bricks/test_ridge_full_length_audit_068.py'
      - '.github/workflows/lego2-068-entire-ridge.yml'
  workflow_dispatch:

jobs:
  all-ridge-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BrickHouse and geometry engines
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "./lego_geometry_engine"
      - name: Regenerate untouched canonical GUIDED-004
        run: python scripts/export_guided004_lego.py > /tmp/lego2-068-export.log
      - name: Fetch pinned LDraw triangles without putting them in repository
        run: python scripts/download_ldraw_probe_066.py /tmp/ldraw-068 --max-files 180
      - name: Real mesh check of all 23 proposed ridge positions
        run: |
          python scripts/probe_full_ridge_068.py artifacts/lego2-guided-004/brick-model.json \
            --ldraw-root /tmp/ldraw-068 --max-sites 25 --shift-studs 3 \
            --output artifacts/lego2-068/ridge-all-sites.json
      - name: Require 23 real measured seam sites and 22 neighbors
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          m = json.loads(Path("artifacts/lego2-guided-004/brick-model.json").read_text())
          r = json.loads(Path("artifacts/lego2-068/ridge-all-sites.json").read_text())
          assert len(m["parts"]) == 1890
          assert r["status"] == "ALL_PROPOSALS_SAMPLED"
          assert r["proposed_sites"] == 23 and r["evaluated_sites"] == 23
          assert len(r["adjacent_shifted_tile_checks"]) == 22
          assert r["model_mutated"] is False and r["physical_certification"] == "NOT_CERTIFIED"
          assert all(x["baseline_opposing_slopes"] in ("CONTACT", "COLLISION", "SEPARATED") for x in r["sites"])
          assert all(x["shifted_opposing_slopes"] in ("CONTACT", "COLLISION", "SEPARATED") for x in r["sites"])
          assert all(x["status"] == "BROKEN_ROOF_COURSE_GEOMETRY" for x in r["sites"]), r["sites"]
          assert r["nominal_course_geometry_counts"] == {"BROKEN_NOMINAL_COURSE_ADVANCE": 23}
          assert all(x["course_advance_validation"]["original_advance_studs"] == 3 for x in r["sites"])
          assert all(x["course_advance_validation"]["shifted_advance_studs"] == 0 for x in r["sites"])
          assert all(x["mesh_relation"] in ("CONTACT", "COLLISION", "SEPARATED") for x in r["adjacent_shifted_tile_checks"])
          print("RIDGE_068_ALL_23_REAL_MESH=PASS")
          print("RIDGE_068_COUNTS=", r["geometry_counts"])
          print("RIDGE_068_ADJACENT_RELATIONS=", r["adjacent_relations"])
          PY
      - name: Upload entire ridge experiment regardless of verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego2-068-entire-ridge-ldraw-report
          path: artifacts/lego2-068/ridge-all-sites.json
          if-no-files-found: warn
          retention-days: 21
