name: NOTICE step 12 insertion-state proof
on:
  push:
    branches: [experiment/notice-step12-visual-action]
    paths: ['.github/workflows/notice-step12-insertion-proof.yml']
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: |
          python -m http.server 4173 --directory frontend >/tmp/http.log 2>&1 &
          cat > capture.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({...devices['Pixel 5']});
          const page=await context.newPage();
          await page.goto('http://127.0.0.1:4173/viewer.html?notice=step-0012&visual=action',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__NOTICE_PROOF__?.support_evidence?.length===2);
          console.log(JSON.stringify(await page.evaluate(()=>window.__NOTICE_PROOF__)));
          await page.locator('.viewer-wrap').screenshot({path:'step12-insertion-state.png'});
          await browser.close();
          JS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: notice-step12-insertion-state
          path: step12-insertion-state.png
          retention-days: 14
