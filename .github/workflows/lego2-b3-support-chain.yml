name: LEGO2 B-3 timber deck to concrete terrace pillar evidence
on:
  pull_request:
    branches: [feat/lego2-existing-house-021]
    paths:
      - "scripts/build_guided004_support_b3.py"
      - "tests/bricks/test_guided004_support_b3.py"
      - ".github/workflows/lego2-b3-support-chain.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-full-house-and-real-stud-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing tools
        run: |
          python -m pip install -e .
          python -m pip install -e ./lego_geometry_engine
          python -m pip install pytest
      - name: Reject deliberately misaligned LEGO bridge
        run: python -m pytest -q tests/bricks/test_guided004_support_b3.py
      - name: Download pinned official LDraw closure for the only new shape and existing roof
        run: |
          python scripts/download_ldraw_probe_066.py /tmp/b3-ldraw --max-files 250 --parts 30363 3005 3003 3001 3007 3008 3623 3002 3622
      - name: Regenerate isolated B2 and construct 1 replacement in full B3 house
        run: |
          python scripts/build_guided004_support_b3.py --ldraw-root /tmp/b3-ldraw --output artifacts/lego2-b3
      - name: Assert exact geometric support route and immutable B2 preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("artifacts/lego2-b3/B3-EXPERIMENTAL-1905")
          delta=json.loads((p/"B2-VS-B3.json").read_text())
          chain=json.loads((p/"CHAIN-PROOF-LOCAL.json").read_text())
          assert (delta["b2_parts"],delta["b3_parts"])==(1905,1904)
          assert len(delta["added_ids"])==1 and len(delta["removed_ids"])==2
          assert delta["moved_ids"]==[]
          assert delta["b2_bytes_unchanged"]
          assert delta["b3_orthogonal_collisions"]==0
          assert delta["b3_roof_unverified"]==408
          assert chain["reaches_modeled_z0"]
          assert chain["edges_positive_stud_cavity"]==chain["edges_total"],chain
          assert chain["first_unproven_edge"] is None
          assert chain["reaches_main_house_wall_or_LEGO_baseplate"]=="NOT_PROVEN"
          rows=(p/"GUIDED004-B3-1905.ldr").read_text().splitlines()
          assert sum(x.startswith("1 ") for x in rows)==1904
          print("B3_FULL_MODEL_1904_PIECES_PASS")
          print("B3_CONCRETE_SUPPORT_CHAIN_REACHES_Z0_PASS")
          print("B3_IDENTICAL_ARCHITECTURE_EXCEPT_INTERNAL_POST_1_FOR_1_PASS")
          print("B3_MECHANICAL_CERTIFICATION_EXPLICITLY_REFUSED_PASS")
          PY
      - name: Upload B3 full model and proof even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOLDUNGO-B3-FULL-HOUSE-SUPPORT-EVIDENCE-NOT-CERTIFIED
          path: artifacts/lego2-b3/
          retention-days: 30
          if-no-files-found: warn
      - name: Permanently commit successful B3 essential artifacts to DRAFT PR branch only
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p missions/B3/generated
          cp artifacts/lego2-b3/B3-EXPERIMENTAL-1905/GUIDED004-B3-1905.ldr missions/B3/generated/
          cp artifacts/lego2-b3/B3-EXPERIMENTAL-1905/B3-FULL-HOUSE-SCHEMATIC.svg missions/B3/generated/
          cp artifacts/lego2-b3/B3-EXPERIMENTAL-1905/BOM-B3.json missions/B3/generated/
          cp artifacts/lego2-b3/B3-EXPERIMENTAL-1905/B2-VS-B3.json missions/B3/generated/
          cp artifacts/lego2-b3/B3-EXPERIMENTAL-1905/CHAIN-PROOF-LOCAL.json missions/B3/generated/
          cp artifacts/lego2-b3/B3-EXPERIMENTAL-1905/ORDER-B3-PROPOSED.json missions/B3/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missions/B3/generated/
          if ! git diff --cached --quiet; then
            git commit -m "B-3: preserve full experimental house and exact timber-deck to concrete-support chain evidence"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi
