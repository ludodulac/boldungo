name: Experiment 012 targeted tests

on:
  pull_request:
    branches:
      - experiment/mv-evidence-targets-011
    paths:
      - 'backend/brickhouse/vision/multiview.py'
      - 'tests/vision/test_multiview_workspace.py'
      - 'tests/survey/test_multiview_workspace_bridge.py'
      - 'tests/survey/test_reasoning_state.py'
      - '.github/workflows/experiment-012-tests.yml'

jobs:
  targeted-tests:
    if: github.head_ref == 'experiment/mv-discrimination-potential-012'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run Experiment 008-012 targeted tests
        run: |
          pytest -q \
            tests/vision/test_multiview_workspace.py \
            tests/survey/test_multiview_workspace_bridge.py \
            tests/survey/test_reasoning_state.py

# Trigger after workflow registration.

# Verification trigger.
